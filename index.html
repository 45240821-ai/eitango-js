*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
#bg{position:fixed; inset:0; z-index:0; background-size:cover; background-position:center top; background-repeat:no-repeat;
  background-color:#C9D3EA;
  background-image:radial-gradient(circle at 18% 12%,#F7E9C8 0,transparent 42%),radial-gradient(circle at 85% 30%,#B8C8F0 0,transparent 46%),radial-gradient(circle at 40% 90%,#E9C9D6 0,transparent 48%)}
#bgov{position:fixed; inset:0; z-index:0; background:var(--paper); opacity:0; pointer-events:none}
#app{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:16px 16px 48px}
/* 枠＝すりガラス（後ろの背景がぼやける） */
.card,.stat,.top,.foot,.dots{
  position:relative; font-family:var(--yomogi);
  background:var(--glass); border:0;
  -webkit-backdrop-filter:blur(16px) saturate(130%); backdrop-filter:blur(16px) saturate(130%);
  box-shadow:0 6px 24px rgba(20,30,60,.10);
}
.card::before,.stat::before,.top::before,.foot::before,.dots::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:2px; background:var(--cafe);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
  pointer-events:none;
}
.top{padding:10px 14px; border-radius:14px}
.foot{padding:10px 14px; border-radius:14px}
.dots{padding:8px 12px; border-radius:14px}
button{font:inherit; font-family:var(--sans); color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1{font-size:20px; margin:8px 0 2px; letter-spacing:.02em}
h2{font-size:16px; margin:0 0 6px}
.sub{color:var(--sub); font-size:14px}
.top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
.nav{display:flex; gap:6px; margin:12px 0 16px}
.nav button{flex:1; min-height:44px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); border-radius:12px; font-weight:600; box-shadow:0 2px 8px rgba(60,50,20,.12)}
.nav button[aria-current="page"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px}
.row{display:flex; gap:8px; flex-wrap:wrap}
.btn{min-height:48px; padding:0 18px; border-radius:12px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; box-shadow:0 2px 8px rgba(60,50,20,.14)}
.btn.primary{background:linear-gradient(180deg,var(--btn),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:700}
.btn.danger{color:#B5302B}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center}
.stat b{display:block; font-size:22px; line-height:1.2}
.stat span{font-size:12px; color:var(--sub)}
.bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:8px 0 4px}
.bar i{display:block; height:100%; background:var(--accent)}
.dots{display:flex; gap:6px; justify-content:center; margin:6px 0 14px}
.dots span{width:20px; height:8px; border-radius:99px; background:var(--line)}
.dots .ok{background:var(--green)} .dots .ng{background:var(--red)}
.dots .now{background:transparent; box-shadow:inset 0 0 0 2px var(--accent)}
.word{font-size:40px; font-weight:800; text-align:center; margin:10px 0 2px; word-break:break-word; letter-spacing:.01em}
.tag{display:block; text-align:center; font-size:13px; color:var(--sub); margin-bottom:14px}
.opts{display:grid; gap:8px}
.opt{width:100%; text-align:left; min-height:56px; padding:10px 14px; border-radius:12px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); box-shadow:0 2px 8px rgba(60,50,20,.12); display:flex; gap:10px; align-items:flex-start}

.opt .t{flex:1}
.opt .w{display:block; font-size:12px; color:#6B6650}
.opt.right{background:linear-gradient(var(--green-bg),var(--green-bg)) padding-box, var(--green) border-box; color:var(--ink)}
.opt.wrong{background:linear-gradient(var(--red-bg),var(--red-bg)) padding-box, var(--red) border-box; color:var(--ink)}
.opt.right .w,.opt.wrong .w{color:var(--sub)}
.opt.dim{opacity:.6}
.fb{border-radius:12px; padding:12px 14px; margin:12px 0}
.fb.ok{background:var(--green-bg); border:1px solid var(--green)}
.fb.ng{background:var(--red-bg); border:1px solid var(--red)}
.fb strong{font-size:16px}
.fb p{margin:4px 0 0; font-size:14px}
.tabs{display:flex; gap:6px; margin-bottom:10px}
.tabs button{flex:1; min-height:40px; border-radius:99px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; font-size:14px; box-shadow:0 2px 8px rgba(60,50,20,.12)}
.tabs button[aria-pressed="true"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800}
.li{padding:10px 0; border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .h{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.li .h b{font-size:18px}
.badge{display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--sub); margin-left:4px}
.badge.on{background:var(--green-bg); color:var(--green); border-color:var(--green)}
.badge.cnt{background:var(--red-bg); color:var(--red); border-color:var(--red)}
.note{font-size:13px; color:var(--sub)}
.empty{text-align:center; padding:28px 8px}
.empty b{display:block; font-size:18px; margin-bottom:6px}
.mini{font-size:14px; margin:2px 0}
.mini b{font-size:16px}
a{color:inherit}
.li b a{text-decoration:underline dotted; text-underline-offset:3px}
.inp{width:100%; min-height:44px; padding:8px 12px; border-radius:12px; border:2px solid transparent;
  background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink);
  font-family:var(--yomogi); font-size:16px; line-height:1.5}
textarea.inp{resize:vertical; min-height:84px}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 8px; -webkit-overflow-scrolling:touch}
.chip{flex:none; min-height:36px; padding:0 14px; border-radius:99px; border:2px solid transparent;
  background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; font-size:14px}

.item{cursor:pointer}

.pos{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:baseline}
.pos dt{font-size:13px; color:var(--sub)} .pos dd{margin:0}

.nav button{font-size:14px; padding:0 4px}

const rnd = a => a[Math.floor(Math.random()*a.length)];

/* ---------- 単語帳（語源分解・語根ファミリー・品詞変身） ----------
   すべて収録データの語源欄から自動で組み立てています（分解できない単語は語源をそのまま表示） */
const IDX = new Map();
WORDS.forEach((w,i)=>{ const k=w[0].toLowerCase(); if(!IDX.has(k)) IDX.set(k,i); });
const ORDER = WORDS.map((w,i)=>i).sort((a,b)=>WORDS[a][0].toLowerCase().localeCompare(WORDS[b][0].toLowerCase()));
const SUF_POS = {ion:'名詞',ation:'名詞',ment:'名詞',ity:'名詞',ness:'名詞',ism:'名詞',ist:'名詞',ance:'名詞',ence:'名詞',ship:'名詞',hood:'名詞',age:'名詞',er:'名詞',or:'名詞',ure:'名詞',
  al:'形容詞',ic:'形容詞',ical:'形容詞',ous:'形容詞',ive:'形容詞',able:'形容詞',ible:'形容詞',ful:'形容詞',less:'形容詞',ary:'形容詞',ant:'形容詞',ent:'形容詞',
  ly:'副詞',ize:'動詞',ise:'動詞',ify:'動詞',ate:'動詞',en:'動詞'};
const LATIN = /^[\p{Script=Latin}\-'’. ~]+$/u;
function parseEty(e){
  const ai = e.indexOf('→');
  const left = (ai>=0 ? e.slice(0,ai) : e).trim();
  const story = ai>=0 ? e.slice(ai+1).trim() : '';
  const parts = left.split(/\s*\+\s*/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const m = s.match(/^(.+?)[（(](.+)[）)]$/);
    return m ? {t:m[1].trim(), g:m[2].trim()} : {t:s, g:''};
  });
  return {structured: parts.length>=2 && parts.every(p=>LATIN.test(p.t)), parts, story, left};
}
function sufInfo(p){
  const m = p.g.match(/(名詞|形容詞|動詞|副詞)(尾|語尾)/);
  if(m) return {pos:m[1], est:false};
  if(p.g && !/尾/.test(p.g)) return null;
  const k = p.t.replace(/^[-~]/,'').toLowerCase();
  return SUF_POS[k] ? {pos:SUF_POS[k], est:true} : null;
}
const INFO = WORDS.map(w=>parseEty(w[2]));
const BASE = new Array(N).fill(-1), BKIND = new Array(N).fill(null);
INFO.forEach((inf,i)=>{
  if(!inf.structured || inf.parts.length!==2) return;
  const j = IDX.get(inf.parts[0].t.toLowerCase());
  const s = sufInfo(inf.parts[1]);
  if(j!==undefined && j!==i && s){ BASE[i]=j; BKIND[i]=s; }
});
const KIDS = Array.from({length:N}, ()=>[]);
BASE.forEach((b,i)=>{ if(b>=0) KIDS[b].push(i); });
function topOf(i){ let k=i, n=0; while(BASE[k]>=0 && n<6){ k=BASE[k]; n++; } return k; }
function roles(i){
  const inf = INFO[i];
  if(!inf.structured) return null;
  const out = [];
  if(BASE[i] >= 0){
    const a = inf.parts[0], b = inf.parts[1], s = BKIND[i];
    out.push({role:'元の単語', t:a.t, g:a.g || WORDS[BASE[i]][1], link:BASE[i]});
    out.push({role:'接尾辞 (Suffix)', t:b.t, g:b.g, pos:s.pos, est:s.est});
    return out;
  }
  const core = [], sufs = [];
  inf.parts.forEach((p,k)=>{ const s = k>0 ? sufInfo(p) : null; if(s) sufs.push({p,s}); else core.push(p); });
  core.forEach((p,k)=> out.push({role: (core.length>=2 && k===0) ? '接頭辞 (Prefix)' : '語根 (Root)', t:p.t, g:p.g}));
  sufs.forEach(x=> out.push({role:'接尾辞 (Suffix)', t:x.p.t, g:x.p.g, pos:x.s.pos, est:x.s.est}));
  return out;
}
function rootKeys(i){
  const r = roles(topOf(i));
  if(!r) return [];
  return r.filter(x=>x.role.startsWith('語根')).map(x=>x.t.toLowerCase().replace(/[^\p{L}]/gu,'')).filter(k=>k.length>=3);
}
const RMAP = new Map();
for(let i=0;i<N;i++) rootKeys(i).forEach(k=>{ if(!RMAP.has(k)) RMAP.set(k,[]); RMAP.get(k).push(i); });
const hash = s => s.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0, 7);
function family(i){
  const seen = new Set([topOf(i)]), out = [], cand = [];
  rootKeys(i).forEach(k=>(RMAP.get(k)||[]).forEach(j=>cand.push(j)));
  cand.sort((a,b)=>WORDS[a][0].localeCompare(WORDS[b][0]));
  const start = cand.length ? hash(WORDS[i][0]) % cand.length : 0;
  for(let n=0; n<cand.length && out.length<3; n++){
    const j = cand[(start+n) % cand.length], tj = topOf(j);
    if(seen.has(tj)) continue;
    seen.add(tj); out.push(j);
  }
  return out;
}
function forms(i){
  const t = topOf(i), res = {'名詞':[], '動詞':[], '形容詞':[], '副詞':[]}, seen = new Set([t]);
  (function walk(k){ KIDS[k].forEach(c=>{ if(seen.has(c)) return; seen.add(c); const s = BKIND[c]; if(s) res[s.pos].push({i:c, est:s.est}); walk(c); }); })(t);
  return {top:t, res};
}
const THEMES = ['今日あったことを書く','友達に気持ちを伝える場面','ニュースを説明するつもりで','自分の将来について','昨日のできごとを話す','おすすめを人に紹介する場面'];

function cardStep(d){ const n = cardList.indexOf(cardIdx) + d; if(n<0 || n>=cardList.length) return; cardIdx = cardList[n]; render(); }

/* ---------- 類題トレーニング（Claude連携） ----------
   PDF → 内容定義 → 類題作成 → テスト・添削 → 苦手から類題、のループ。
   Claudeに直接つながる環境（claude.aiで開いたページ）では自動、それ以外は「依頼文をコピー→返事を貼り付け」の手動です。 */
const cx = () => S.cx || (S.cx = {def:'', text:'', name:'', items:[], run:null, n:5, seq:1});
let SAMPLE = null, cxBusy = '', cxMsg = '', cxPending = null;
try{ if(window.claude && window.claude.use) window.claude.use('sample').then(s=>{ SAMPLE = s || null; if(view==='cx') render(); }).catch(()=>{}); }catch(e){}
const itemOf = id => cx().items.find(i=>i.id===id);
const br = s => esc(s).replace(/\n/g,'<br>');
function parseJSON(txt){
  const s = String(txt).replace(/```(?:json)?/g,'');
  const a = s.search(/[\[{]/); if(a<0) throw new Error('no json');
  const close = s[a]==='[' ? ']' : '}', b = s.lastIndexOf(close);
  if(b<a) throw new Error('no json');
  return JSON.parse(s.slice(a,b+1));
}
function promptFor(kind, arg){
  const c = cx(), src = c.text.slice(0,12000);
  if(kind==='define') return '以下は問題集・過去問のPDFから取り出したテキストです。出題内容を定義してください。\n教科、単元ごとの要点、問題の形式（4択／記述）、難易度の目安、よく出るパターンを、日本語で簡潔にまとめてください。\n\n--- 本文 ---\n' + src;
  if(kind==='gen'){
    const weak = arg.weak.map(it=>'・' + it.q + (it.t==='c' ? '（正解: ' + it.c[it.a] + '）' : '（模範解答: ' + it.m + '）')).join('\n');
    return 'あなたは問題作成者です。次の「出題内容の定義」に合う類似問題を' + arg.n + '問作ってください。\n'
      + (weak ? '次は私が間違えた問題です。同じ考え方で、数値や条件を変えた類題を中心に作ってください。\n' + weak + '\n' : '')
      + '\n--- 出題内容の定義 ---\n' + (c.def || src)
      + '\n\n出力は次のJSON配列だけにしてください（説明文・コードブロックは不要）。\n[{"unit":"単元名","t":"c または f","q":"問題文","c":["選択肢1","選択肢2","選択肢3","選択肢4"],"a":正解の番号(0〜3),"m":"模範解答","e":"解説"}]\nt が "c"（4択）のときは c と a を、"f"（記述）のときは m を必ず入れてください。';
  }
  return '次の記述問題の答案を添削してください。\n問題: ' + arg.it.q + '\n模範解答: ' + arg.it.m + '\n私の答案: ' + arg.ans + '\n\n出力は次のJSONだけにしてください。\n{"ok":true または false,"comment":"良い点と直す点を短く"}';
}
function handle(kind, text, arg){
  const c = cx();
  if(kind==='define'){ c.def = String(text).trim(); cxMsg = '内容を定義しました'; return; }
  if(kind==='gen'){
    const arr = parseJSON(text);
    if(!Array.isArray(arr)) throw new Error('array');
    let n = 0;
    arr.forEach(o=>{
      if(!o || !o.q) return;
      const t = o.t==='f' ? 'f' : 'c';
      if(t==='c' && !(Array.isArray(o.c) && o.c.length>=2 && Number.isInteger(o.a) && o.a>=0 && o.a<o.c.length)) return;
      if(t==='f' && !o.m) return;
      c.items.push({id:c.seq++, unit:o.unit||'', t, q:String(o.q), c:t==='c' ? o.c.map(String) : [], a:t==='c' ? o.a : 0, m:o.m ? String(o.m) : '', e:o.e ? String(o.e) : '', ng:0, ok:0, weak:false, streak:0});
      n++;
    });
    if(!n) throw new Error('empty');
    cxMsg = n + '問を追加しました';
    return;
  }
  const r = parseJSON(text);
  finishAnswer(arg.it, !!r.ok, r.comment || '');
}
async function ask(kind, arg){
  const prompt = promptFor(kind, arg);
  if(!SAMPLE){ cxPending = {kind, prompt, arg}; cxMsg = ''; render(); return; }
  cxBusy = 'Claudeに依頼中…'; cxMsg = ''; render();
  try{
    const r = await SAMPLE(prompt, {modelTier:'default', cache:false});
    handle(kind, r.text, arg); cxPending = null;
  }catch(e){
    cxMsg = '自動の依頼がうまくいきませんでした（' + ((e && e.code) || '結果を読み取れず') + '）。下の手動でも進められます。';
    cxPending = {kind, prompt, arg};
  }
  cxBusy = ''; save(); render();
}
function importPending(){
  const ta = document.getElementById('cxpaste'), p = cxPending;
  if(!p || !ta) return;
  try{ handle(p.kind, ta.value, p.arg); cxPending = null; }
  catch(e){ cxMsg = '読み取れませんでした。Claudeの返事を、そのまま貼り付けてください。'; }
  save(); render();
}

function cxDefine(){ const c = cx(); if(!c.text.trim()){ cxMsg = '先にPDFを読み込むか、テキストを貼り付けてください'; render(); return; } ask('define'); }
function cxGen(fromWeak){
  const c = cx();
  if(!(c.def || c.text.trim())){ cxMsg = '先にPDFの内容を入れるか、内容定義を作ってください'; render(); return; }
  ask('gen', {n:c.n, weak: fromWeak ? c.items.filter(i=>i.weak).slice(0,5) : []});
}
function cxStats(){
  const it = cx().items, answered = it.filter(i=>i.ok+i.ng>0).length;
  return {n:it.length, todo:it.length-answered, weak:it.filter(i=>i.weak).length, done:it.filter(i=>!i.weak && i.ng>0).length};

/* PDF読み込み（pdf.jsでテキストを取り出す。画像だけのPDFは取れないので、その場合は貼り付け） */
async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });

async function pickPdf(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  cxBusy = 'PDFを読み込み中…'; cxMsg = ''; render();
  try{
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({data: await f.arrayBuffer()}).promise;
    let out = '';
    for(let p=1; p<=Math.min(doc.numPages, 40); p++){
      const tc = await (await doc.getPage(p)).getTextContent();
      out += tc.items.map(i=>i.str).join(' ') + '\n\n';
    }
    out = out.trim();
    if(out.length < 20) throw new Error('empty');
    cx().text = out.slice(0, 30000); cx().name = f.name; cxMsg = '読み込みました（' + doc.numPages + 'ページ）';
  }catch(e){ cxMsg = 'PDFから文字を取り出せませんでした。画像のPDFかもしれません。テキストを貼り付けてください。'; }
  cxBusy = ''; save(); render();
}

function finishAnswer(it, good, fb){

   PDFの読み取りや問題づくり・添削はClaudeのチャットで行い、このアプリは
   「依頼文の作成」「返ってきたJSONの取り込み」「出題・採点・苦手管理」を担当します */
const EXS = () => S.ex || (S.ex = {ranges:[]});
let exv = {rid:null, ses:null, msg:'', n:10, confirmDel:false, from:'ex', sub:'数学', big:7};
const CIRC = ['①','②','③','④','⑤','⑥'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const exRange = id => EXS().ranges.find(r=>r.id===id);
function exCounts(r){
  const qs = r.qs;
  return {n:qs.length, left:qs.filter(q=>!q.done).length, weak:qs.filter(q=>q.weak).length, mastered:qs.filter(q=>q.m).length};
}
function parseLoose(txt){
  let s = String(txt).trim();
  const f = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(f) s = f[1];
  const pos = ['[','{'].map(c=>s.indexOf(c)).filter(x=>x>=0);
  if(!pos.length) throw new Error('no json');
  s = s.slice(Math.min(...pos));
  try{ return JSON.parse(s); }catch(e){
    const b = Math.max(s.lastIndexOf(']'), s.lastIndexOf('}'));
    return JSON.parse(s.slice(0, b+1));
  }
}
function normQ(x){
  if(!x || typeof x !== 'object') return null;
  const q = String(x.q || x.question || '').trim();
  if(!q) return null;
  const ch = Array.isArray(x.choices) ? x.choices.map(String) : [];
  const t = (x.t === 'free' || ch.length < 2) ? 'free' : 'mc';
  let a = x.a !== undefined ? x.a : x.answer;
  if(t === 'mc'){ a = Number(a) - 1; if(!(a >= 0 && a < ch.length)) return null; }
  else a = String(a === undefined ? '' : a);
  return {id:uid(), t, q, choices: t==='mc' ? ch : [], a, exp:String(x.exp || x.explanation || ''), topic:String(x.topic || ''),
    fig: !!x.fig, from: String(x.from || ''), done:false, weak:false, m:false, streak:0, ok:0, ng:0};
}
function importDef(txt, sub, big){
  const o = parseLoose(txt), d = Array.isArray(o) ? o[0] : o;
  if(!d || !d.title) throw new Error('title');
  const ex = (d.examples || []).map(normQ).filter(Boolean).map(e=>({t:e.t, q:e.q, choices:e.choices, a:e.a, exp:e.exp}));
  const r = {id:uid(), title:String(d.title), subject: sub || String(d.subject || ''), big: big > 0 ? big : 0, scope:String(d.scope || ''),
    topics:(d.topics || []).map(String), level:String(d.level || ''), examples:ex, qs:[], status:'active'};
  EXS().ranges.push(r); save(); return r;
}
function importExamples(r, txt){
  const o = parseLoose(txt), arr = Array.isArray(o) ? o : (o.examples || []);
  const have = new Set(r.examples.map(e=>e.q));
  let added = 0, skip = 0;
  arr.forEach(x=>{ const e = normQ(x); if(!e || have.has(e.q)){ skip++; return; } have.add(e.q); r.examples.push({t:e.t, q:e.q, choices:e.choices, a:e.a, exp:e.exp}); added++; });
  if(!Array.isArray(o) && o.level) r.level = String(o.level);
  save(); return {added, skip};
}
function importQs(r, txt){
  let o = parseLoose(txt);
  if(!Array.isArray(o)) o = o.questions || o.qs || o.items || [];
  const have = new Set(r.qs.map(q=>q.q));
  let added = 0, skip = 0;
  o.forEach(x=>{ const q = normQ(x); if(!q || have.has(q.q)){ skip++; return; } have.add(q.q); r.qs.push(q); added++; });
  if(added && r.status === 'done') r.status = 'active';
  save(); return {added, skip};
}

function exGenCopy(weak){ const r = exRange(exv.rid); if(!r.examples.length){ exMsg('先に例題を読み込んでください'); return; } exCopy(weak ? promptWeak(r, exv.n) : promptGen(r, exv.n)); }
function exOpen(id){ exv.rid = id; exv.confirmDel = false; view = 'exr'; render(); }
function exHome(){ exv.rid = null; view = 'ex'; render(); }
function exBack(){ if(exv.from === 'exr' && exv.rid && exRange(exv.rid)){ view = 'exr'; render(); } else exHome(); }
function exImportDef(){
  try{ const r = importDef(document.getElementById('exdef').value, exv.sub, exv.big); exv.msg = '範囲「' + r.title + '」を作りました。次は、例題を読み込みます'; exOpen(r.id); }
  catch(e){ exMsg('読み取れませんでした。Claudeの返信のJSONをそのまま貼ってください'); }
}
function exImportEx(){
  const r = exRange(exv.rid);
  try{ const res = importExamples(r, document.getElementById('exex').value); exv.msg = res.added + '問の例題を追加しました' + (res.skip ? '（' + res.skip + '問は形式が合わないか重複のため除外）' : ''); render(); }
  catch(e){ exMsg('読み取れませんでした。Claudeの返信のJSONをそのまま貼ってください', 'exmsg2'); }
}
function exImportQs(){
  const r = exRange(exv.rid);
  try{ const res = importQs(r, document.getElementById('exqs').value); exv.msg = res.added + '問を追加しました' + (res.skip ? '（' + res.skip + '問は形式が合わないか重複のため除外）' : ''); render(); }
  catch(e){ exMsg('読み取れませんでした。Claudeの返信のJSONをそのまま貼ってください'); }
}
function exReset(r){ r.qs.forEach(q=>{ q.done = false; }); r.status = 'active'; save(); render(); }
function exDelete(){ const R = EXS().ranges, k = R.findIndex(r=>r.id===exv.rid); if(k>=0) R.splice(k,1); save(); exHome(); }
function exPool(mode, rid){
  const out = [];
  EXS().ranges.filter(r=> rid ? r.id===rid : (mode==='weak' || r.status!=='done')).forEach(r=>r.qs.forEach(q=>{ if(mode==='weak' ? q.weak : !q.done) out.push({r, q}); }));
  return out;
}
function exStart(mode, rid){
  exv.from = rid ? 'exr' : 'ex';
  exv.ses = {mode, rid:rid || null, cur:null, picked:null, revealed:false, last:null, notice:'', ans:'', msg:'', review:'', end:false};
  exNext(); view = 'exq'; render();
}
function exNext(){
  const s = exv.ses;
  let pool = exPool(s.mode, s.rid);
  if(s.mode==='weak' && pool.length>1) pool = pool.filter(x=>x.q.id !== s.last);
  s.picked = null; s.revealed = false; s.ans = ''; s.msg = ''; s.review = '';
  if(!pool.length){ s.end = true; s.cur = null; return; }
  const x = rnd(pool); s.cur = {rid:x.r.id, qid:x.q.id}; s.end = false;
}
function exApply(r, q, correct){
  const s = exv.ses;
  if(correct) q.ok++; else q.ng++;
  if(s.mode === 'range'){
    q.done = true;
    if(!correct){ q.weak = true; q.m = false; q.streak = 0; s.msg = '苦手に登録しました'; }
    if(r.qs.length && r.qs.every(x=>x.done)){ r.status = 'done'; s.notice = '「' + r.title + '」の範囲を終了しました'; }
  } else if(correct){
    q.streak++;
    if(q.streak >= 2){ q.weak = false; q.m = true; s.msg = '克服しました（2回連続で正解）'; } else s.msg = '克服まであと1回連続で正解';
  } else { q.streak = 0; s.msg = 'もう一度練習しましょう'; }
  s.last = q.id; save();
}
function exCur(){ const s = exv.ses, r = exRange(s.cur.rid); return {s, r, q: r.qs.find(x=>x.id===s.cur.qid)}; }
function exChoose(k){ const {s, r, q} = exCur(); if(s.picked !== null) return; s.picked = k; exApply(r, q, k === q.a); render(); }
function exReveal(){ const {s} = exCur(); s.revealed = true; render(); }
function exJudge(ok){ const {s, r, q} = exCur(); if(s.picked !== null) return; s.picked = ok ? 1 : 0; exApply(r, q, ok); render(); }
function exSetAns(v){ exv.ses.ans = v; }
function exReview(){ const {s, r, q} = exCur(); exCopy(promptReview(r, q, s.ans)); }

/* ----- 自動モード（ブラウザからClaude APIを直接呼ぶ。キーは入力した端末にだけ保存） ----- */
const API_STORE = 'vocabFreq_api_v1';
let API = (function(){
  try{ const o = JSON.parse(localStorage.getItem(API_STORE) || 'null'); if(o && o.key) return {key:o.key, model:o.model || 'claude-sonnet-5-5'}; }catch(e){}
  return {key:'', model:'claude-sonnet-5-5'};
})();
function saveApi(){ try{ localStorage.setItem(API_STORE, JSON.stringify(API)); }catch(e){} }
async function callClaude(content, maxTokens){
  if(!API.key) throw new Error('APIキーが未設定です');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json', 'x-api-key':API.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model:API.model, max_tokens:maxTokens || 8000, messages:[{role:'user', content}]})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error((data.error && data.error.message) || ('エラー ' + res.status));
  return (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
async function exAuto(label, job, mid){
  if(exv.busy) return;
  if(!API.key){ exMsg('先に、「自動モード」でAPIキーを設定してください', mid); return; }
  exv.busy = true; exMsg(label + '…（しばらくかかります）', mid);
  try{ await job(); }catch(e){ exMsg('失敗しました：' + (e && e.message ? e.message : e), mid); }
  exv.busy = false;
}
const readB64 = f => new Promise((ok, ng)=>{ const fr = new FileReader(); fr.onload = ()=>ok(String(fr.result).split(',')[1]); fr.onerror = ()=>ng(new Error('PDFを読めませんでした')); fr.readAsDataURL(f); });
const pdfBlock = b64 => ({type:'document', source:{type:'base64', media_type:'application/pdf', data:b64}});
function exAutoDef(ev){
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  if(f.size > 25*1024*1024){ exMsg('PDFが大きすぎます（25MBまで）'); return; }
  const sub = exv.sub, big = exv.big;
  exAuto('範囲のPDFを読み取り中', async ()=>{
    const text = await callClaude([pdfBlock(await readB64(f)), {type:'text', text:promptScope(sub, big)}], 8000);
    const r = importDef(text, sub, big);
    exv.msg = '範囲「' + r.title + '」を作りました。次は、例題を読み込みます';
    exOpen(r.id);
  });
}
function exAutoEx(ev){
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  if(f.size > 25*1024*1024){ exMsg('PDFが大きすぎます（25MBまで）', 'exmsg2'); return; }
  const r = exRange(exv.rid);
  exAuto('例題のPDFを読み取り中', async ()=>{
    const text = await callClaude([pdfBlock(await readB64(f)), {type:'text', text:promptExamples(r)}], 16000);
    const res = importExamples(r, text);
    exv.msg = res.added + '問の例題を追加しました' + (res.skip ? '（' + res.skip + '問は形式が合わないか重複のため除外）' : '');
    render();
  }, 'exmsg2');
}
function exAutoQs(weak){
  const r = exRange(exv.rid), n = exv.n;
  if(!r.examples.length){ exMsg('先に例題を読み込んでください'); return; }
  exAuto('類題を作成中', async ()=>{
    const text = await callClaude([{type:'text', text: weak ? promptWeak(r, n) : promptGen(r, n)}], 12000);
    const res = importQs(r, text);
    exv.msg = res.added + '問を追加しました' + (res.skip ? '（' + res.skip + '問は形式が合わないか重複のため除外）' : '');
    render();
  });
}
function exAutoReview(){
  const {s, r, q} = exCur();
  exAuto('添削中', async ()=>{
    s.review = await callClaude([{type:'text', text:promptReview(r, q, s.ans)}], 2000);
    render();
  });
}

function exQuestionView(){
  const s = exv.ses, weakMode = s.mode === 'weak';
  const title = weakMode ? '苦手テスト' : '演習';
  if(s.end){
    return `<div class="top"><div><h1>${title}</h1></div><button class="btn" onclick="exBack()">戻る</button></div>
    ${s.notice ? `<div class="card"><b>${esc(s.notice)}</b></div>` : ''}
    <div class="card empty"><b>${weakMode ? '苦手な問題はありません' : '出せる問題がなくなりました'}</b>
      <p class="sub">${weakMode ? '演習で間違えた問題がここに集まります。' : 'Claudeに類題を作ってもらうと、続きができます。'}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" onclick="exBack()">範囲へ戻る</button></div></div>`;
  }
  const {r, q} = exCur(), left = exPool(s.mode, s.rid).length, ans = s.picked !== null;
  let body = '';
  if(q.t === 'mc'){
    body = '<div class="opts">' + q.choices.map((c,k)=>{
      let cls = 'opt';
      if(ans){ if(k===q.a) cls += ' right'; else if(k===s.picked) cls += ' wrong'; else cls += ' dim'; }
      return `<button class="${cls}" ${ans?'disabled':''} onclick="exChoose(${k})"><span class="k">${k+1}</span><span class="t">${esc(c)}</span></button>`;
    }).join('') + '</div>';
  } else {
    body = `<textarea class="inp" rows="4" placeholder="自分の答えを書く" ${s.revealed?'disabled':''} oninput="exSetAns(this.value)">${esc(s.ans)}</textarea>
      ${!s.revealed ? `<div style="height:8px"></div><button class="btn primary block" onclick="exReveal()">答え合わせ</button>` : ''}`;
  }
  let fb = '';
  if(q.t === 'mc' && ans){
    const ok = s.picked === q.a;
    fb = `<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解':'不正解'}</strong><p>正解：${CIRC[q.a]||q.a+1} ${esc(q.choices[q.a])}</p>${q.exp?`<p class="exa">${esc(q.exp)}</p>`:''}${s.msg?`<p><b>${esc(s.msg)}</b></p>`:''}</div>`;
  } else if(q.t === 'free' && s.revealed){
    if(!ans) fb = `<div class="fb ok"><strong>模範解答</strong><p class="exa">${esc(q.a)}</p>${q.exp?`<p class="exa">${esc(q.exp)}</p>`:''}</div>
      <div class="row" style="margin-bottom:8px"><button class="btn" style="flex:1" onclick="exJudge(true)">できた</button><button class="btn" style="flex:1" onclick="exJudge(false)">できなかった</button></div>
      <button class="btn block" onclick="exReview()">Claudeに添削してもらう（コピー）</button><button class="btn block" style="margin-top:8px" onclick="exAutoReview()">Claudeで添削する（API）</button><p class="note" id="exmsg"></p>${s.review ? `<div class="fb ok"><strong>添削</strong><p class="exa">${esc(s.review)}</p></div>` : ''}`;
    else { const ok = s.picked === 1; fb = `<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'できた':'できなかった'}</strong><p class="exa">${esc(q.a)}</p>${s.msg?`<p><b>${esc(s.msg)}</b></p>`:''}</div>`; }
  }
  const nextBtn = ans ? `${s.notice ? `<p class="note"><b>${esc(s.notice)}</b></p>` : ''}<button class="btn primary block" onclick="exv.ses.notice='';exNext();render()">次の問題へ</button>` : '';
  return `<div class="top"><div><h1>${title}</h1><div class="sub">${esc(r.title)}　残り${left}問${q.topic ? '　' + esc(q.topic) : ''}</div></div><button class="btn" onclick="exBack()">戻る</button></div>
  <div class="card"><div class="exq">${esc(q.q)}</div>${body}${fb}</div>${nextBtn}`;
}

/* ---------- 出題 ---------- */
function makeQ(i){
  const correct = WORDS[i][1];
  const opts = [i];
  let tries = 0;
  while(opts.length < 4 && tries < 800){
    tries++;
    const j = Math.floor(Math.random()*N);
    if(opts.includes(j)) continue;
    if(WORDS[j][1] === correct) continue;
    if(stem(WORDS[j][0]) === stem(WORDS[i][0])) continue;   // 派生語は選択肢に出さない
    if(opts.some(k => WORDS[k][1] === WORDS[j][1])) continue;
    opts.push(j);
  }
  return {i, opts:shuffle(opts), pick:null, msg:'', good:false};
}
function pickNext(mode){
  if(mode === 'basic'){
    const seen = new Set(S.seen);
    const pool = [];
    for(let i=0;i<N;i++) if(!seen.has(i)) pool.push(i);
    return pool.length ? rnd(pool) : null;
  }
  const pool = weakList();
  if(!pool.length) return null;
  let avail = pool.filter(i => !S.weakRound.includes(i));
  if(!avail.length){ S.weakRound = []; avail = pool; }
  const last = S.ses ? S.ses.last : null;
  if(avail.length > 1 && last !== null) avail = avail.filter(i => i !== last);
  return rnd(avail);
}

/* ---------- 判定ルール ----------
   不正解: 苦手に登録（基本✓・苦手✓はリセット）
   正解  : 苦手単語は、全問テストで正解→基本✓ / 苦手テストで正解→苦手✓
   両方✓ : 克服 */
function applyAnswer(i, correct, mode){
  const s = S.stat[i] || (S.stat[i] = {weak:false, b:false, k:false, m:false, ng:0, ok:0});
  let msg = '', good = correct;
  if(correct){
    s.ok++;
    if(s.weak){
      if(mode === 'basic') s.b = true; else s.k = true;
      if(s.b && s.k){ s.weak = false; s.m = true; msg = '克服しました'; }
      else {
        const need = [];
        if(!s.b) need.push('全問テスト');
        if(!s.k) need.push('苦手克服テスト');
        msg = '克服まであと：' + need.join('と') + 'で正解';
      }
    }
  } else {
    s.ng++; s.weak = true; s.m = false; s.b = false; s.k = false;
    msg = '苦手単語に登録しました';
  }
  return {msg, good};
}

/* ---------- 操作 ---------- */
function start(mode){
  confirming = null;
  if(!(S.ses && S.ses.mode === mode && S.ses.cur)){
    S.ses = {mode, n:0, ok:0, dots:[], setWrong:[], cur:null, ph:'q', last:null};
    nextQ();
  }
  view = 'test'; save(); render();
}
function nextQ(){
  const i = pickNext(S.ses.mode);
  if(i === null){ S.ses.cur = null; S.ses.ph = 'end'; }
  else { S.ses.cur = makeQ(i); S.ses.ph = 'q'; }
  save();
}
function choose(k){
  const ses = S.ses;
  if(!ses || ses.ph !== 'q') return;
  const q = ses.cur;
  q.pick = k;
  const correct = (k === q.i);
  const r = applyAnswer(q.i, correct, ses.mode);
  q.msg = r.msg; q.good = r.good;
  ses.n++; S.tot.n++;
  if(correct){ ses.ok++; S.tot.ok++; }
  ses.dots.push(correct ? 1 : 0);
  if(!correct) ses.setWrong.push(q.i);
  if(ses.mode === 'basic'){ if(!S.seen.includes(q.i)) S.seen.push(q.i); }
  else if(!S.weakRound.includes(q.i)) S.weakRound.push(q.i);
  ses.last = q.i;
  ses.ph = 'fb';
  save(); render();
}
function next(){
  const ses = S.ses;
  if(!ses || ses.ph !== 'fb') return;
  if(ses.n % SET_SIZE === 0){ ses.ph = 'br'; save(); render(); return; }
  nextQ(); render();
}
function cont(){
  const ses = S.ses;
  ses.dots = []; ses.setWrong = [];
  nextQ(); render();
}
function goHome(){ view='home'; confirming=null; render(); }
function resetSeen(){            // 乱数で出る単語の「既出」だけリセット（苦手・克服・成績は残す）
  S.seen = []; S.weakRound = []; confirming = null;
  if(S.ses && S.ses.mode === 'basic'){ S.ses = null; }
  save(); render();
}
function switchSlot(i){ DB.cur=i; S=DB.slots[i]; view='home'; weakTab='weak'; confirming=null; save(); render(); }
function newSlot(){
  if(DB.slots.length >= MAX_SLOTS) return;
  DB.slots.push(blank('データ'+(DB.slots.length+1)));
  DB.cur = DB.slots.length-1; S = DB.slots[DB.cur];
  view='home'; weakTab='weak'; confirming=null; save(); render();
}
function ask(c){ confirming = c; render(); }
function copyWeak(){
  const text = weakList().sort((a,b)=>S.stat[b].ng-S.stat[a].ng).map(i => WORDS[i][0]+'\t'+WORDS[i][1]).join('\n');
  const done = ok => { copyMsg = ok ? 'コピーしました' : 'コピーできませんでした'; render(); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false)); return;
    }
  }catch(e){}
  try{
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); const ok = document.execCommand('copy'); document.body.removeChild(t); done(ok);
  }catch(e){ done(false); }
}

/* ---------- 画面 ---------- */
function nav(){
  return `<div class="nav" role="tablist">
    <button onclick="goHome()" ${view==='home'||view==='test'?'aria-current="page"':''}>テスト</button>
    <button onclick="view='book';render()" ${view==='book'||view==='card'?'aria-current="page"':''}>単語帳</button>
    <button onclick="view='weak';render()" ${view==='weak'?'aria-current="page"':''}>苦手 ${weakList().length}</button>
  </div>`;
}
function homeView(){
  const seenN = S.seen.length, remain = N - seenN;
  const weakN = weakList().length, doneN = doneList().length;
  const acc = S.tot.n ? Math.round(S.tot.ok / S.tot.n * 100) + '%' : '–';
  const ses = S.ses;
  const resumeBasic = ses && ses.mode==='basic' && ses.cur;
  const resumeWeak  = ses && ses.mode==='weak'  && ses.cur;
  let reset = '';
  if(confirming === 'seen'){
    reset = `<p class="mini"><b>既出をリセットしますか？</b></p><p class="note">選択中のデータの、全問テストの出題済みだけを戻します。苦手単語・克服・成績は残ります。</p>
      <div class="row"><button class="btn primary" onclick="resetSeen()">リセットする</button><button class="btn" onclick="ask(null)">やめる</button></div>`;
  } else {
    reset = `<div class="row"><button class="btn" onclick="ask('seen')">既出をリセット</button></div>`;
  }
  return `
  <div class="top"><div><h1>頻度学習 単語テスト</h1><div class="sub">${N}語・4択　使用中：${esc(S.name)}</div></div></div>
  ${nav()}
  <div class="stats">
    <div class="stat"><b>${remain}</b><span>未出題</span></div>
    <div class="stat"><b>${weakN}</b><span>苦手</span></div>
    <div class="stat"><b>${doneN}</b><span>克服</span></div>
    <div class="stat"><b>${acc}</b><span>正答率</span></div>
  </div>
  <div class="card">
    <h2>全問テスト</h2>
    <div class="sub">まだ出ていない単語を乱数で出題します。</div>
    <div class="bar"><i style="width:${seenN/N*100}%"></i></div>
    <div class="note" style="margin-bottom:10px">出題済み ${seenN} / ${N}</div>
    <button class="btn primary block" ${remain===0?'disabled':''} onclick="start('basic')">${resumeBasic?'続きから（'+ses.n+'問済み）':'全問テストを始める'}</button>
    ${remain===0?'<p class="note">全単語を出題しました。下の「既出をリセット」でもう一周できます。</p>':''}
  </div>
  <div class="card">
    <h2>苦手克服テスト</h2>
    <div class="sub">間違えた単語だけを乱数で出題します。</div>
    <div style="height:10px"></div>
    <button class="btn primary block" ${weakN===0?'disabled':''} onclick="start('weak')">${resumeWeak?'続きから（'+ses.n+'問済み）':'苦手 '+weakN+'語を練習する'}</button>
    ${weakN===0?'<p class="note">全問テストで間違えた単語がここに集まります。</p>':''}
  </div>
  <div class="card">
    <h2>データ</h2>
    <div class="sub">成績を最大${MAX_SLOTS}つまで別々に保存できます。</div>
    <div class="row" style="margin:10px 0">${DB.slots.map((s,i)=>`<button class="btn ${i===DB.cur?'primary':''}" aria-pressed="${i===DB.cur}" onclick="switchSlot(${i})">${esc(s.name)}</button>`).join('')}</div>
    <button class="btn block" ${DB.slots.length>=MAX_SLOTS?'disabled':''} onclick="newSlot()">新しいデータを作成${DB.slots.length>=MAX_SLOTS?'（'+MAX_SLOTS+'つまで）':''}</button>
  </div>
  <div class="card">
    <h2>リセット</h2>
    ${reset}
  </div>
  ${exSummaryCard()}
  <p class="note foot">${SET_SIZE}問ごとに休憩画面が出ます。状態は1問ごとに自動保存され、ブラウザを閉じても続きから再開できます。</p>`;
}
function dotsHtml(ses){
  let h = '';
  for(let k=0;k<SET_SIZE;k++){
    const c = k < ses.dots.length ? (ses.dots[k] ? 'ok' : 'ng') : (k === ses.dots.length && ses.ph === 'q' ? 'now' : '');
    h += `<span class="${c}"></span>`;
  }
  return `<div class="dots" aria-label="この${SET_SIZE}問の結果">${h}</div>`;
}
function testView(){
  const ses = S.ses;
  const label = ses.mode === 'basic' ? '全問テスト' : '苦手克服テスト';
  const head = `<div class="top"><div><h1>${label}</h1><div class="sub">${ses.n}問解答・正解 ${ses.ok}</div></div>
    <button class="btn" onclick="goHome()">ホーム</button></div>`;

  if(ses.ph === 'end'){
    const isBasic = ses.mode === 'basic';
    return head + `<div class="card empty"><b>${isBasic?'全単語を出題しました':'苦手単語がなくなりました'}</b>
      <p class="sub">${isBasic?'「既出をリセット」で、苦手単語を残したままもう一周できます。':'全問テストで新しく間違えた単語がここに追加されます。'}</p>
      <div class="row" style="justify-content:center">${isBasic?'<button class="btn primary" onclick="resetSeen();goHome()">既出をリセット</button>':''}<button class="btn" onclick="goHome()">ホームへ</button></div></div>`;
  }

  if(ses.ph === 'br'){
    const ok = ses.dots.reduce((a,b)=>a+b,0);
    const wrongs = ses.setWrong.map(i => `<div class="li"><div class="h"><b>${esc(WORDS[i][0])}</b></div><div class="sub">${esc(WORDS[i][1])}</div></div>`).join('');
    return head + `<div class="card">
      <h2>休憩 — ${SET_SIZE}問終了</h2>
      ${dotsHtml(ses)}
      <p class="mini">この${SET_SIZE}問：<b>${ok}/${SET_SIZE}</b>正解</p>
      <p class="mini">苦手 <b>${weakList().length}</b>語 ／ 克服 <b>${doneList().length}</b>語</p>
      <p class="note">ここまでの状態を保存しました。</p>
      ${wrongs ? `<h2 style="margin-top:14px">間違えた単語</h2>${wrongs}` : '<p class="mini" style="margin-top:10px">全問正解です。</p>'}
      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="cont()">続ける</button><button class="btn" onclick="goHome()">ホームへ</button></div>
    </div>`;
  }

  const q = ses.cur, w = WORDS[q.i];
  const answered = ses.ph === 'fb';
  const opts = q.opts.map((j, idx) => {
    let c = 'opt';
    if(answered){
      if(j === q.i) c += ' right';
      else if(j === q.pick) c += ' wrong';
      else c += ' dim';
    }
    const sub = answered && j !== q.i ? `<span class="w">${esc(WORDS[j][0])}</span>` : '';
    return `<button class="${c}" ${answered?'disabled':''} onclick="choose(${j})"><span class="k">${idx+1}</span><span class="t">${esc(WORDS[j][1])}${sub}</span></button>`;
  }).join('');

  let fb = '';
  if(answered){
    fb = `<div class="fb ${q.good?'ok':'ng'}">
      <strong>${q.good?'正解':'不正解'}</strong>
      <p><b>${esc(w[0])}</b>：${esc(w[1])}</p>
      <p>語源：${esc(w[2])}</p>
      ${q.msg?`<p><b>${esc(q.msg)}</b></p>`:''}
    </div>
    <button class="btn block" style="margin-bottom:8px" onclick="openCard(${q.i})">単語帳でくわしく見る</button>
    <button class="btn primary block" onclick="next()">次の問題へ</button>`;
  }
  return head + dotsHtml(ses) + `<div class="card">
    <div class="word">${esc(w[0])}</div>
    <span class="tag">意味を選んでください（キー 1〜4）</span>
    <div class="opts">${opts}</div>
    ${fb}
  </div>`;
}
function weakView(){
  const list = weakTab === 'weak'
    ? weakList().sort((a,b)=>S.stat[b].ng-S.stat[a].ng)
    : doneList().sort((a,b)=>WORDS[a][0].localeCompare(WORDS[b][0]));
  const items = list.map(i => {
    const s = S.stat[i], w = WORDS[i];
    const badges = weakTab === 'weak'
      ? `<span class="badge cnt">誤答${s.ng}</span><span class="badge ${s.b?'on':''}">全問${s.b?'✓':''}</span><span class="badge ${s.k?'on':''}">苦手${s.k?'✓':''}</span>`
      : `<span class="badge on">克服</span>`;
    return `<div class="li"><div class="h"><b><a href="#" onclick="openCard(${i});return false">${esc(w[0])}</a></b><span>${badges}</span></div>
      <div>${esc(w[1])}</div><div class="note">${esc(w[2])}</div></div>`;
  }).join('');
  const empty = weakTab === 'weak'
    ? `<div class="empty"><b>苦手単語はありません</b><span class="sub">テストで間違えた単語がここに集まります。</span></div>`
    : `<div class="empty"><b>克服した単語はまだありません</b><span class="sub">全問テストと苦手克服テストの両方で正解すると克服になります。</span></div>`;
  return `<div class="top"><div><h1>苦手単語</h1><div class="sub">誤答の多い順</div></div></div>
  ${nav()}
  <div class="tabs">
    <button aria-pressed="${weakTab==='weak'}" onclick="weakTab='weak';copyMsg='';render()">苦手 ${weakList().length}</button>
    <button aria-pressed="${weakTab==='done'}" onclick="weakTab='done';copyMsg='';render()">克服済み ${doneList().length}</button>
  </div>
  ${weakTab==='weak' && list.length ? `<div class="row" style="margin-bottom:8px;align-items:center"><button class="btn" onclick="copyWeak()">一覧をコピー</button><span class="note">${copyMsg}</span></div>` : ''}
  <div class="card">${list.length ? items : empty}</div>
  ${weakTab==='weak' && list.length ? `<p class="note">克服＝全問テストと苦手克服テストの両方で正解。全問テストで再び出すには、ホームで既出をリセットします。</p>` : ''}`;
}
function render(){
  const app = document.getElementById('app');
  if(view === 'test' && S.ses) app.innerHTML = testView();
  else if(view === 'weak') app.innerHTML = weakView();
  else if(view === 'book'){ app.innerHTML = bookView(); renderBookList(); }
  else if(view === 'card') app.innerHTML = cardView();
  else if(view === 'ex') app.innerHTML = exHomeView();
  else if(view === 'exr' && exv.rid && exRange(exv.rid)) app.innerHTML = exRangeView(exRange(exv.rid));
  else if(view === 'exq' && exv.ses) app.innerHTML = exQuestionView();
  else if(view === 'cx') app.innerHTML = cxView();
  else if(view === 'cxrun' && cx().run) app.innerHTML = cxRunView();
  else { view = 'home'; app.innerHTML = homeView(); }
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if(view !== 'test' || !S.ses) return;
  const ses = S.ses;
  if(ses.ph === 'q' && ['1','2','3','4'].includes(e.key)){ choose(ses.cur.opts[Number(e.key)-1]); }
  else if((e.key === 'Enter' || e.key === ' ') && ses.ph === 'fb'){ e.preventDefault(); next(); }
  else if(e.key === 'Enter' && ses.ph === 'br'){ cont(); }
});
applyBg();
render();
</script>
