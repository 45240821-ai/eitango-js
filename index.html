:root{
  --cafe:linear-gradient(135deg,#E8D5BC 0%,#C29A72 35%,#8B5E3C 62%,#D4B48F 100%);
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
  --yomogi:'YomogiEmb','Yomogi',"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --paper:#F3ECE3; --card:#FFFFFF; --ink:#3A281C; --sub:#6B5342; --line:#D8C4AE;
  --red:#D23C36; --red-bg:#FCE9E8; --green:#1F7F5D; --green-bg:#E1F2EA;
  --accent:#8B5430; --accent-bg:#EADBC8; --accent-ink:#FFFFFF;
  --btn:#FBF6E6; --btn-deep:#F1E7C4; --btn-line:#E2D6AE; --btn-ink:#2B2A22;
  --glass:linear-gradient(135deg,rgba(242,229,212,.66),rgba(214,184,150,.60)); --glass-line:rgba(255,255,255,.4);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#241A14; --card:#3A2A20; --ink:#F7ECDD; --sub:#DAC7AF; --line:#6B5240;
    --red:#FF6B63; --red-bg:#3A1F2A; --green:#52D1A0; --green-bg:#16352E;
    --accent:#E6BB8E; --accent-bg:#5A4333; --accent-ink:#241A14;
    --btn:#FBF6E6; --btn-deep:#F1E7C4; --btn-line:#E2D6AE; --btn-ink:#2B2A22;
    --glass:linear-gradient(135deg,rgba(84,60,44,.68),rgba(56,40,30,.70)); --glass-line:rgba(255,255,255,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#241A14; --card:#3A2A20; --ink:#F7ECDD; --sub:#DAC7AF; --line:#6B5240;
  --red:#FF6B63; --red-bg:#3A1F2A; --green:#52D1A0; --green-bg:#16352E;
  --accent:#E6BB8E; --accent-bg:#5A4333; --accent-ink:#241A14;
    --btn:#FBF6E6; --btn-deep:#F1E7C4; --btn-line:#E2D6AE; --btn-ink:#2B2A22;
    --glass:linear-gradient(135deg,rgba(84,60,44,.68),rgba(56,40,30,.70)); --glass-line:rgba(255,255,255,.14);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
#bg{position:fixed; inset:0; z-index:0; background-size:cover; background-position:center top; background-repeat:no-repeat;
  background-color:#C9D3EA;
  background-image:radial-gradient(circle at 18% 12%,#F7E9C8 0,transparent 42%),radial-gradient(circle at 85% 30%,#B8C8F0 0,transparent 46%),radial-gradient(circle at 40% 90%,#E9C9D6 0,transparent 48%)}
#bgov{position:fixed; inset:0; z-index:0; background:var(--paper); opacity:0; pointer-events:none}
#app{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:16px 16px 48px}
/* 枠＝すりガラス（後ろの背景がぼやける） */
.card,.stat,.top,.foot,.dots{
  position:relative; font-family:var(--yomogi);
  background:var(--glass); border:0;
  -webkit-backdrop-filter:blur(16px) saturate(130%); backdrop-filter:blur(16px) saturate(130%);
  box-shadow:0 6px 24px rgba(20,30,60,.10);
}
.card::before,.stat::before,.top::before,.foot::before,.dots::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:2px; background:var(--cafe);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
  pointer-events:none;
}
.top{padding:10px 14px; border-radius:14px}
.foot{padding:10px 14px; border-radius:14px}
.dots{padding:8px 12px; border-radius:14px}
button{font:inherit; font-family:var(--sans); color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1{font-size:20px; margin:8px 0 2px; letter-spacing:.02em}
h2{font-size:16px; margin:0 0 6px}
.sub{color:var(--sub); font-size:14px}
.top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
.nav{display:flex; gap:6px; margin:12px 0 16px}
.nav button{flex:1; min-height:44px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); border-radius:12px; font-weight:600; box-shadow:0 2px 8px rgba(60,50,20,.12)}
.nav button[aria-current="page"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px}
.row{display:flex; gap:8px; flex-wrap:wrap}
.btn{min-height:48px; padding:0 18px; border-radius:12px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; box-shadow:0 2px 8px rgba(60,50,20,.14)}
.btn.primary{background:linear-gradient(180deg,var(--btn),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:700}
.btn.danger{color:#B5302B}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center}
.stat b{display:block; font-size:22px; line-height:1.2}
.stat span{font-size:12px; color:var(--sub)}
.bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:8px 0 4px}
.bar i{display:block; height:100%; background:var(--accent)}
.dots{display:flex; gap:6px; justify-content:center; margin:6px 0 14px}
.dots span{width:20px; height:8px; border-radius:99px; background:var(--line)}
.dots .ok{background:var(--green)} .dots .ng{background:var(--red)}
.dots .now{background:transparent; box-shadow:inset 0 0 0 2px var(--accent)}
.word{font-size:40px; font-weight:800; text-align:center; margin:10px 0 2px; word-break:break-word; letter-spacing:.01em}
.tag{display:block; text-align:center; font-size:13px; color:var(--sub); margin-bottom:14px}
.opts{display:grid; gap:8px}
.opt{width:100%; text-align:left; min-height:56px; padding:10px 14px; border-radius:12px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); box-shadow:0 2px 8px rgba(60,50,20,.12); display:flex; gap:10px; align-items:flex-start}
.opt .k{flex:none; width:24px; height:24px; border-radius:7px; background:rgba(60,50,20,.08); color:#7A4E2D; font-weight:700; font-size:13px; display:grid; place-items:center; margin-top:2px}
.opt .t{flex:1}
.opt .w{display:block; font-size:12px; color:#6B6650}
.opt.right{background:linear-gradient(var(--green-bg),var(--green-bg)) padding-box, var(--green) border-box; color:var(--ink)}
.opt.wrong{background:linear-gradient(var(--red-bg),var(--red-bg)) padding-box, var(--red) border-box; color:var(--ink)}
.opt.right .w,.opt.wrong .w{color:var(--sub)}
.opt.dim{opacity:.6}
.fb{border-radius:12px; padding:12px 14px; margin:12px 0}
.fb.ok{background:var(--green-bg); border:1px solid var(--green)}
.fb.ng{background:var(--red-bg); border:1px solid var(--red)}
.fb strong{font-size:16px}
.fb p{margin:4px 0 0; font-size:14px}
.tabs{display:flex; gap:6px; margin-bottom:10px}
.tabs button{flex:1; min-height:40px; border-radius:99px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; font-size:14px; box-shadow:0 2px 8px rgba(60,50,20,.12)}
.tabs button[aria-pressed="true"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800}
.li{padding:10px 0; border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .h{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.li .h b{font-size:18px}
.badge{display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--sub); margin-left:4px}
.badge.on{background:var(--green-bg); color:var(--green); border-color:var(--green)}
.badge.cnt{background:var(--red-bg); color:var(--red); border-color:var(--red)}
.note{font-size:13px; color:var(--sub)}
.empty{text-align:center; padding:28px 8px}
.empty b{display:block; font-size:18px; margin-bottom:6px}
.mini{font-size:14px; margin:2px 0}
.mini b{font-size:16px}

const doneList = () => Object.keys(S.stat).filter(i => S.stat[i].m).map(Number);
const stem = w => w.slice(0,4).toLowerCase();
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const rnd = a => a[Math.floor(Math.random()*a.length)];

/* ---------- 出題 ---------- */
function makeQ(i){
  const correct = WORDS[i][1];
  const opts = [i];
  let tries = 0;
  while(opts.length < 4 && tries < 800){
    tries++;
    const j = Math.floor(Math.random()*N);
    if(opts.includes(j)) continue;
    if(WORDS[j][1] === correct) continue;
    if(stem(WORDS[j][0]) === stem(WORDS[i][0])) continue;   // 派生語は選択肢に出さない
    if(opts.some(k => WORDS[k][1] === WORDS[j][1])) continue;
    opts.push(j);
  }
  return {i, opts:shuffle(opts), pick:null, msg:'', good:false};
}
function pickNext(mode){
  if(mode === 'basic'){
    const seen = new Set(S.seen);
    const pool = [];
    for(let i=0;i<N;i++) if(!seen.has(i)) pool.push(i);
    return pool.length ? rnd(pool) : null;
  }
  const pool = weakList();
  if(!pool.length) return null;
  let avail = pool.filter(i => !S.weakRound.includes(i));
  if(!avail.length){ S.weakRound = []; avail = pool; }
  const last = S.ses ? S.ses.last : null;
  if(avail.length > 1 && last !== null) avail = avail.filter(i => i !== last);
  return rnd(avail);
}

/* ---------- 判定ルール ----------
   不正解: 苦手に登録（基本✓・苦手✓はリセット）
   正解  : 苦手単語は、全問テストで正解→基本✓ / 苦手テストで正解→苦手✓
   両方✓ : 克服 */
function applyAnswer(i, correct, mode){
  const s = S.stat[i] || (S.stat[i] = {weak:false, b:false, k:false, m:false, ng:0, ok:0});
  let msg = '', good = correct;
  if(correct){
    s.ok++;
    if(s.weak){
      if(mode === 'basic') s.b = true; else s.k = true;
      if(s.b && s.k){ s.weak = false; s.m = true; msg = '克服しました'; }
      else {
        const need = [];
        if(!s.b) need.push('全問テスト');
        if(!s.k) need.push('苦手克服テスト');
        msg = '克服まであと：' + need.join('と') + 'で正解';
      }
    }
  } else {
    s.ng++; s.weak = true; s.m = false; s.b = false; s.k = false;
    msg = '苦手単語に登録しました';
  }
  return {msg, good};
}

/* ---------- 操作 ---------- */
function start(mode){
  confirming = null;
  if(!(S.ses && S.ses.mode === mode && S.ses.cur)){
    S.ses = {mode, n:0, ok:0, dots:[], setWrong:[], cur:null, ph:'q', last:null};
    nextQ();
  }
  view = 'test'; save(); render();
}
function nextQ(){
  const i = pickNext(S.ses.mode);
  if(i === null){ S.ses.cur = null; S.ses.ph = 'end'; }
  else { S.ses.cur = makeQ(i); S.ses.ph = 'q'; }
  save();
}
function choose(k){
  const ses = S.ses;
  if(!ses || ses.ph !== 'q') return;
  const q = ses.cur;
  q.pick = k;
  const correct = (k === q.i);
  const r = applyAnswer(q.i, correct, ses.mode);
  q.msg = r.msg; q.good = r.good;
  ses.n++; S.tot.n++;
  if(correct){ ses.ok++; S.tot.ok++; }
  ses.dots.push(correct ? 1 : 0);
  if(!correct) ses.setWrong.push(q.i);
  if(ses.mode === 'basic'){ if(!S.seen.includes(q.i)) S.seen.push(q.i); }
  else if(!S.weakRound.includes(q.i)) S.weakRound.push(q.i);
  ses.last = q.i;
  ses.ph = 'fb';
  save(); render();
}
function next(){
  const ses = S.ses;
  if(!ses || ses.ph !== 'fb') return;
  if(ses.n % SET_SIZE === 0){ ses.ph = 'br'; save(); render(); return; }
  nextQ(); render();
}
function cont(){
  const ses = S.ses;
  ses.dots = []; ses.setWrong = [];
  nextQ(); render();
}
function goHome(){ view='home'; confirming=null; render(); }
function resetSeen(){            // 乱数で出る単語の「既出」だけリセット（苦手・克服・成績は残す）
  S.seen = []; S.weakRound = []; confirming = null;
  if(S.ses && S.ses.mode === 'basic'){ S.ses = null; }
  save(); render();
}
function switchSlot(i){ DB.cur=i; S=DB.slots[i]; view='home'; weakTab='weak'; confirming=null; save(); render(); }
function newSlot(){
  if(DB.slots.length >= MAX_SLOTS) return;
  DB.slots.push(blank('データ'+(DB.slots.length+1)));
  DB.cur = DB.slots.length-1; S = DB.slots[DB.cur];
  view='home'; weakTab='weak'; confirming=null; save(); render();
}
function ask(c){ confirming = c; render(); }
function copyWeak(){
  const text = weakList().sort((a,b)=>S.stat[b].ng-S.stat[a].ng).map(i => WORDS[i][0]+'\t'+WORDS[i][1]).join('\n');
  const done = ok => { copyMsg = ok ? 'コピーしました' : 'コピーできませんでした'; render(); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false)); return;
    }
  }catch(e){}
  try{
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); const ok = document.execCommand('copy'); document.body.removeChild(t); done(ok);
  }catch(e){ done(false); }
}

/* ---------- 画面 ---------- */
function nav(){
  return `<div class="nav" role="tablist">
    <button onclick="goHome()" ${view==='home'||view==='test'?'aria-current="page"':''}>テスト</button>
    <button onclick="view='weak';render()" ${view==='weak'?'aria-current="page"':''}>苦手単語 ${weakList().length}</button>
  </div>`;
}
function homeView(){
  const seenN = S.seen.length, remain = N - seenN;
  const weakN = weakList().length, doneN = doneList().length;
  const acc = S.tot.n ? Math.round(S.tot.ok / S.tot.n * 100) + '%' : '–';
  const ses = S.ses;
  const resumeBasic = ses && ses.mode==='basic' && ses.cur;
  const resumeWeak  = ses && ses.mode==='weak'  && ses.cur;
  let reset = '';
  if(confirming === 'seen'){
    reset = `<p class="mini"><b>既出をリセットしますか？</b></p><p class="note">選択中のデータの、全問テストの出題済みだけを戻します。苦手単語・克服・成績は残ります。</p>
      <div class="row"><button class="btn primary" onclick="resetSeen()">リセットする</button><button class="btn" onclick="ask(null)">やめる</button></div>`;
  } else {
    reset = `<div class="row"><button class="btn" onclick="ask('seen')">既出をリセット</button></div>`;
  }
  return `
  <div class="top"><div><h1>頻度学習 単語テスト</h1><div class="sub">${N}語・4択　使用中：${esc(S.name)}</div></div></div>
  ${nav()}
  <div class="stats">
    <div class="stat"><b>${remain}</b><span>未出題</span></div>
    <div class="stat"><b>${weakN}</b><span>苦手</span></div>
    <div class="stat"><b>${doneN}</b><span>克服</span></div>
    <div class="stat"><b>${acc}</b><span>正答率</span></div>
  </div>
  <div class="card">
    <h2>全問テスト</h2>
    <div class="sub">まだ出ていない単語を乱数で出題します。</div>
    <div class="bar"><i style="width:${seenN/N*100}%"></i></div>
    <div class="note" style="margin-bottom:10px">出題済み ${seenN} / ${N}</div>
    <button class="btn primary block" ${remain===0?'disabled':''} onclick="start('basic')">${resumeBasic?'続きから（'+ses.n+'問済み）':'全問テストを始める'}</button>
    ${remain===0?'<p class="note">全単語を出題しました。下の「既出をリセット」でもう一周できます。</p>':''}
  </div>
  <div class="card">
    <h2>苦手克服テスト</h2>
    <div class="sub">間違えた単語だけを乱数で出題します。</div>
    <div style="height:10px"></div>
    <button class="btn primary block" ${weakN===0?'disabled':''} onclick="start('weak')">${resumeWeak?'続きから（'+ses.n+'問済み）':'苦手 '+weakN+'語を練習する'}</button>
    ${weakN===0?'<p class="note">全問テストで間違えた単語がここに集まります。</p>':''}
  </div>
  <div class="card">
    <h2>データ</h2>
    <div class="sub">成績を最大${MAX_SLOTS}つまで別々に保存できます。</div>
    <div class="row" style="margin:10px 0">${DB.slots.map((s,i)=>`<button class="btn ${i===DB.cur?'primary':''}" aria-pressed="${i===DB.cur}" onclick="switchSlot(${i})">${esc(s.name)}</button>`).join('')}</div>
    <button class="btn block" ${DB.slots.length>=MAX_SLOTS?'disabled':''} onclick="newSlot()">新しいデータを作成${DB.slots.length>=MAX_SLOTS?'（'+MAX_SLOTS+'つまで）':''}</button>
  </div>
  <div class="card">
    <h2>リセット</h2>
    ${reset}
  </div>
  <p class="note foot">${SET_SIZE}問ごとに休憩画面が出ます。状態は1問ごとに自動保存され、ブラウザを閉じても続きから再開できます。</p>`;
}
function dotsHtml(ses){
  let h = '';
  for(let k=0;k<SET_SIZE;k++){
    const c = k < ses.dots.length ? (ses.dots[k] ? 'ok' : 'ng') : (k === ses.dots.length && ses.ph === 'q' ? 'now' : '');
    h += `<span class="${c}"></span>`;
  }
  return `<div class="dots" aria-label="この${SET_SIZE}問の結果">${h}</div>`;
}
function testView(){
  const ses = S.ses;
  const label = ses.mode === 'basic' ? '全問テスト' : '苦手克服テスト';
  const head = `<div class="top"><div><h1>${label}</h1><div class="sub">${ses.n}問解答・正解 ${ses.ok}</div></div>
    <button class="btn" onclick="goHome()">ホーム</button></div>`;

  if(ses.ph === 'end'){
    const isBasic = ses.mode === 'basic';
    return head + `<div class="card empty"><b>${isBasic?'全単語を出題しました':'苦手単語がなくなりました'}</b>
      <p class="sub">${isBasic?'「既出をリセット」で、苦手単語を残したままもう一周できます。':'全問テストで新しく間違えた単語がここに追加されます。'}</p>
      <div class="row" style="justify-content:center">${isBasic?'<button class="btn primary" onclick="resetSeen();goHome()">既出をリセット</button>':''}<button class="btn" onclick="goHome()">ホームへ</button></div></div>`;
  }

  if(ses.ph === 'br'){
    const ok = ses.dots.reduce((a,b)=>a+b,0);
    const wrongs = ses.setWrong.map(i => `<div class="li"><div class="h"><b>${esc(WORDS[i][0])}</b></div><div class="sub">${esc(WORDS[i][1])}</div></div>`).join('');
    return head + `<div class="card">
      <h2>休憩 — ${SET_SIZE}問終了</h2>
      ${dotsHtml(ses)}
      <p class="mini">この${SET_SIZE}問：<b>${ok}/${SET_SIZE}</b>正解</p>
      <p class="mini">苦手 <b>${weakList().length}</b>語 ／ 克服 <b>${doneList().length}</b>語</p>
      <p class="note">ここまでの状態を保存しました。</p>
      ${wrongs ? `<h2 style="margin-top:14px">間違えた単語</h2>${wrongs}` : '<p class="mini" style="margin-top:10px">全問正解です。</p>'}
      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="cont()">続ける</button><button class="btn" onclick="goHome()">ホームへ</button></div>
    </div>`;
  }

  const q = ses.cur, w = WORDS[q.i];
  const answered = ses.ph === 'fb';
  const opts = q.opts.map((j, idx) => {
    let c = 'opt';
    if(answered){
      if(j === q.i) c += ' right';
      else if(j === q.pick) c += ' wrong';
      else c += ' dim';
    }
    const sub = answered && j !== q.i ? `<span class="w">${esc(WORDS[j][0])}</span>` : '';
    return `<button class="${c}" ${answered?'disabled':''} onclick="choose(${j})"><span class="k">${idx+1}</span><span class="t">${esc(WORDS[j][1])}${sub}</span></button>`;
  }).join('');

  let fb = '';
  if(answered){
    fb = `<div class="fb ${q.good?'ok':'ng'}">
      <strong>${q.good?'正解':'不正解'}</strong>
      <p><b>${esc(w[0])}</b>：${esc(w[1])}</p>
      <p>語源：${esc(w[2])}</p>
      ${q.msg?`<p><b>${esc(q.msg)}</b></p>`:''}
    </div>
    <button class="btn primary block" onclick="next()">次の問題へ</button>`;
  }
  return head + dotsHtml(ses) + `<div class="card">
    <div class="word">${esc(w[0])}</div>
    <span class="tag">意味を選んでください（キー 1〜4）</span>
    <div class="opts">${opts}</div>
    ${fb}
  </div>`;
}
function weakView(){
  const list = weakTab === 'weak'
    ? weakList().sort((a,b)=>S.stat[b].ng-S.stat[a].ng)
    : doneList().sort((a,b)=>WORDS[a][0].localeCompare(WORDS[b][0]));
  const items = list.map(i => {
    const s = S.stat[i], w = WORDS[i];
    const badges = weakTab === 'weak'
      ? `<span class="badge cnt">誤答${s.ng}</span><span class="badge ${s.b?'on':''}">全問${s.b?'✓':''}</span><span class="badge ${s.k?'on':''}">苦手${s.k?'✓':''}</span>`
      : `<span class="badge on">克服</span>`;
    return `<div class="li"><div class="h"><b>${esc(w[0])}</b><span>${badges}</span></div>
      <div>${esc(w[1])}</div><div class="note">${esc(w[2])}</div></div>`;
  }).join('');
  const empty = weakTab === 'weak'
    ? `<div class="empty"><b>苦手単語はありません</b><span class="sub">テストで間違えた単語がここに集まります。</span></div>`
    : `<div class="empty"><b>克服した単語はまだありません</b><span class="sub">全問テストと苦手克服テストの両方で正解すると克服になります。</span></div>`;
  return `<div class="top"><div><h1>苦手単語</h1><div class="sub">誤答の多い順</div></div></div>
  ${nav()}
  <div class="tabs">
    <button aria-pressed="${weakTab==='weak'}" onclick="weakTab='weak';copyMsg='';render()">苦手 ${weakList().length}</button>
    <button aria-pressed="${weakTab==='done'}" onclick="weakTab='done';copyMsg='';render()">克服済み ${doneList().length}</button>
  </div>
  ${weakTab==='weak' && list.length ? `<div class="row" style="margin-bottom:8px;align-items:center"><button class="btn" onclick="copyWeak()">一覧をコピー</button><span class="note">${copyMsg}</span></div>` : ''}
  <div class="card">${list.length ? items : empty}</div>
  ${weakTab==='weak' && list.length ? `<p class="note">克服＝全問テストと苦手克服テストの両方で正解。全問テストで再び出すには、ホームで既出をリセットします。</p>` : ''}`;
}
function render(){
  const app = document.getElementById('app');
  if(view === 'test' && S.ses) app.innerHTML = testView();
  else if(view === 'weak') app.innerHTML = weakView();
  else { view = 'home'; app.innerHTML = homeView(); }
  window.scrollTo(0, 0);
}
