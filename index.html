html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
#bg{position:fixed; inset:0; z-index:0; background-size:cover; background-position:center top; background-repeat:no-repeat;
  background-color:#C9D3EA;
  background-image:radial-gradient(circle at 18% 12%,#F7E9C8 0,transparent 42%),radial-gradient(circle at 85% 30%,#B8C8F0 0,transparent 46%),radial-gradient(circle at 40% 90%,#E9C9D6 0,transparent 48%)}
#bgov{position:fixed; inset:0; z-index:0; background:var(--paper); opacity:0; pointer-events:none}
#app{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:16px 16px 48px}
/* 枠＝すりガラス（後ろの背景がぼやける） */
.card,.stat,.top,.foot,.dots{
  position:relative; font-family:var(--yomogi);
  background:var(--glass); border:0;
  -webkit-backdrop-filter:blur(16px) saturate(130%); backdrop-filter:blur(16px) saturate(130%);
  box-shadow:0 6px 24px rgba(20,30,60,.10);
}
.card::before,.stat::before,.top::before,.foot::before,.dots::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:2px; background:var(--cafe);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
  pointer-events:none;
}
.top{padding:10px 14px; border-radius:14px}
.foot{padding:10px 14px; border-radius:14px}
.dots{padding:8px 12px; border-radius:14px}
button{font:inherit; font-family:var(--sans); color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1{font-size:20px; margin:8px 0 2px; letter-spacing:.02em}
h2{font-size:16px; margin:0 0 6px}
.sub{color:var(--sub); font-size:14px}
.top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
.top > div{min-width:0}
.top .btn{flex:none; white-space:nowrap}
.nav{display:flex; gap:6px; margin:12px 0 16px}
.nav button{flex:1; min-height:44px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); border-radius:12px; font-weight:600; box-shadow:0 2px 8px rgba(60,50,20,.12)}
.nav button[aria-current="page"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800}
.card{border-radius:14px; padding:16px; margin-bottom:12px}
.row{display:flex; gap:8px; flex-wrap:wrap}
.btn{min-height:48px; padding:0 18px; border-radius:12px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; box-shadow:0 2px 8px rgba(60,50,20,.14)}
.btn.primary{background:linear-gradient(180deg,var(--btn),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:700}
.btn.danger{color:#B5302B}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px}
.stat{border-radius:12px; padding:10px 6px; text-align:center}
.stat b{display:block; font-size:22px; line-height:1.2}
.stat span{font-size:12px; color:var(--sub)}
.bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:8px 0 4px}
.bar i{display:block; height:100%; background:var(--accent)}
.dots{display:flex; gap:6px; justify-content:center; margin:6px 0 14px}
.dots span{width:20px; height:8px; border-radius:99px; background:var(--line)}
.dots .ok{background:var(--green)} .dots .ng{background:var(--red)}
.dots .now{background:transparent; box-shadow:inset 0 0 0 2px var(--accent)}
.word{font-size:40px; font-weight:800; text-align:center; margin:10px 0 2px; word-break:break-word; letter-spacing:.01em}
.tag{display:block; text-align:center; font-size:13px; color:var(--sub); margin-bottom:14px}
.opts{display:grid; gap:8px}
.opt{width:100%; text-align:left; min-height:56px; padding:10px 14px; border-radius:12px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); box-shadow:0 2px 8px rgba(60,50,20,.12); display:flex; gap:10px; align-items:flex-start}
.opt .k{flex:none; width:24px; height:24px; border-radius:7px; background:rgba(60,50,20,.08); color:#7A4E2D; font-weight:700; font-size:13px; display:grid; place-items:center; margin-top:2px}
.opt .t{flex:1}
.opt .w{display:block; font-size:12px; color:#6B6650}
.opt.right{background:linear-gradient(var(--green-bg),var(--green-bg)) padding-box, var(--green) border-box; color:var(--ink)}
.opt.wrong{background:linear-gradient(var(--red-bg),var(--red-bg)) padding-box, var(--red) border-box; color:var(--ink)}
.opt.right .w,.opt.wrong .w{color:var(--sub)}
.opt.dim{opacity:.6}
.opt.sel{background:linear-gradient(#F3E2C4,#F3E2C4) padding-box, linear-gradient(#7A4E2D,#7A4E2D) border-box; font-weight:700}
.opt.sel .k{background:#7A4E2D; color:#fff}
.fb{border-radius:12px; padding:12px 14px; margin:12px 0}
.fb.ok{background:var(--green-bg); border:1px solid var(--green)}
.fb.ng{background:var(--red-bg); border:1px solid var(--red)}
.fb strong{font-size:16px}
.fb p{margin:4px 0 0; font-size:14px}
.tabs{display:flex; gap:6px; margin-bottom:10px}
.tabs button{flex:1; min-height:40px; border-radius:99px; border:2px solid transparent; background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; font-size:14px; box-shadow:0 2px 8px rgba(60,50,20,.12)}
.tabs button[aria-pressed="true"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800}
.li{padding:10px 0; border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .h{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.li .h b{font-size:18px}
.badge{display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--sub); margin-left:4px}
.badge.on{background:var(--green-bg); color:var(--green); border-color:var(--green)}
.badge.cnt{background:var(--red-bg); color:var(--red); border-color:var(--red)}
.note{font-size:13px; color:var(--sub)}
.empty{text-align:center; padding:28px 8px}
.empty b{display:block; font-size:18px; margin-bottom:6px}
.mini{font-size:14px; margin:2px 0}
.mini b{font-size:16px}
a{color:inherit}
.li b a{text-decoration:underline dotted; text-underline-offset:3px}
.inp{width:100%; min-height:44px; padding:8px 12px; border-radius:12px; border:2px solid transparent;
  background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink);
  font-family:var(--yomogi); font-size:16px; line-height:1.5}
textarea.inp{resize:vertical; min-height:84px}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 8px; -webkit-overflow-scrolling:touch}
.chip{flex:none; min-height:36px; padding:0 14px; border-radius:99px; border:2px solid transparent;
  background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); font-weight:600; font-size:14px}
.chip[aria-pressed="true"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800}
.item{cursor:pointer}
.item:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:8px}
.part{display:flex; gap:10px; align-items:baseline; padding:8px 0; border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0}
.part .lab{flex:none; font-size:12px; padding:2px 10px; border-radius:99px; background:var(--accent-bg); color:var(--accent); white-space:nowrap}
.bigword{font-size:34px; font-weight:800; margin:0; word-break:break-word}
.pos{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:baseline}
.pos dt{font-size:13px; color:var(--sub)} .pos dd{margin:0}
.exq{white-space:pre-wrap; font-size:17px; line-height:1.85; margin:4px 0 12px; word-break:break-word}
.exa{white-space:pre-wrap; line-height:1.7}
.uw{cursor:pointer; border-radius:4px; padding:0 1px; -webkit-tap-highlight-color:transparent} .uw:hover{background:rgba(194,154,114,.25)}
.uw.x{color:#C0392B; text-decoration:line-through; text-decoration-thickness:2px; font-weight:700; background:rgba(192,57,43,.12)}
.uw.x::before{content:'✕'; font-size:.7em; margin-right:1px; text-decoration:none; display:inline-block}
select.inp{appearance:auto}
.steps{margin:6px 0 0; padding-left:20px; font-size:14px} .steps li{margin:4px 0}
/* 手書き・計算用紙 */
.padhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0}
.padbar{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:6px 0}
.pseg{display:flex; gap:4px; align-items:center}
.pbtn{min-height:36px; padding:0 11px; border-radius:10px; border:2px solid transparent; font-size:13px; font-weight:600; font-family:var(--sans); color:var(--btn-ink);
  background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; box-shadow:0 1px 5px rgba(60,50,20,.12)}
.pbtn[aria-pressed="true"]{background:linear-gradient(var(--btn-deep),var(--btn-deep)) padding-box, var(--cafe) border-box; font-weight:800; box-shadow:inset 0 0 0 1px var(--accent)}
.pbtn[disabled]{opacity:.45}
.sw{width:32px; height:32px; padding:0; border-radius:50%; border:3px solid var(--btn); background:var(--c); box-shadow:0 0 0 2px var(--btn-line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.padbox{position:relative; height:240px; border-radius:12px; overflow:hidden; border:2px solid transparent;
  background:linear-gradient(#FFFDF5,#FFFDF5) padding-box, var(--cafe) border-box}
.padbox.tall{height:440px}
.padbox::before{content:""; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle, rgba(139,94,60,.30) 1px, transparent 1.5px); background-size:22px 22px}
.padcv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.scrtab{position:fixed; right:0; top:38%; z-index:60; width:34px; padding:8px 0 9px; border-radius:12px 0 0 12px; border:2px solid transparent; border-right:0;
  display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11px; font-weight:700; line-height:1.1; font-family:var(--sans); color:var(--btn-ink);
  background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; box-shadow:0 4px 14px rgba(60,50,20,.28)}
.scrtab[hidden],.scr[hidden]{display:none}
.scrtab svg{width:20px; height:20px}
.scrtab span{font-size:11px; line-height:1.2; text-align:center}
body.exqv #app{padding-right:calc(40px + env(safe-area-inset-right))}
.scr{position:fixed; left:0; right:0; bottom:0; z-index:70; height:52vh; height:52dvh; max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:4px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-radius:18px 18px 0 0; border-top:3px solid #C29A72; background:var(--scrbg); color:var(--ink);
  box-shadow:0 -8px 26px rgba(20,30,60,.28)}
.scr.full{height:100vh; height:100dvh; max-width:none; border-radius:0}
.scr .padbox{flex:1; height:auto; min-height:110px}
.scrhead{display:flex; justify-content:space-between; align-items:center; gap:8px}
.scrhead .tabs{margin:0; flex:0 1 auto}
.scrhead .tabs button{flex:none; width:46px; min-height:34px}
.scr .pbtn{min-height:32px; padding:0 9px}
.scr .sw{width:28px; height:28px}
.scr .padbar{margin:2px 0; gap:4px 8px}
body.scropen #app{padding-bottom:calc(52vh + 24px)}
#exfb{scroll-margin-top:12px; scroll-margin-bottom:16px}
body.scropen #exfb{scroll-margin-bottom:56vh}
.hubgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.hubbtn{min-height:120px; padding:14px; border-radius:16px; border:2px solid transparent; text-align:left; display:flex; flex-direction:column; justify-content:space-between; gap:6px;
  background:linear-gradient(var(--btn),var(--btn)) padding-box, var(--cafe) border-box; color:var(--btn-ink); box-shadow:0 4px 14px rgba(60,50,20,.16)}
.hubbtn b{font-size:20px} .hubbtn span{font-size:13px; color:#6B6650; line-height:1.5}
.hubbtn:active{transform:translateY(1px)}
.aibox{white-space:pre-wrap; line-height:1.8; font-size:15px; margin:8px 0}
.nav button{font-size:14px; padding:0 4px}
textarea.inp[readonly]{opacity:.9}
</style>

/* ---------- 単語帳（語源分解・語根ファミリー・品詞変身） ----------
   すべて収録データの語源欄から自動で組み立てています（分解できない単語は語源をそのまま表示） */
const IDX = new Map();
WORDS.forEach((w,i)=>{ const k=w[0].toLowerCase(); if(!IDX.has(k)) IDX.set(k,i); });
const ORDER = WORDS.map((w,i)=>i).sort((a,b)=>WORDS[a][0].toLowerCase().localeCompare(WORDS[b][0].toLowerCase()));
const SUF_POS = {ion:'名詞',ation:'名詞',ment:'名詞',ity:'名詞',ness:'名詞',ism:'名詞',ist:'名詞',ance:'名詞',ence:'名詞',ship:'名詞',hood:'名詞',age:'名詞',er:'名詞',or:'名詞',ure:'名詞',
  al:'形容詞',ic:'形容詞',ical:'形容詞',ous:'形容詞',ive:'形容詞',able:'形容詞',ible:'形容詞',ful:'形容詞',less:'形容詞',ary:'形容詞',ant:'形容詞',ent:'形容詞',
  ly:'副詞',ize:'動詞',ise:'動詞',ify:'動詞',ate:'動詞',en:'動詞'};
const LATIN = /^[\p{Script=Latin}\-'’. ~]+$/u;
function parseEty(e){
  const ai = e.indexOf('→');
  const left = (ai>=0 ? e.slice(0,ai) : e).trim();
  const story = ai>=0 ? e.slice(ai+1).trim() : '';
  const parts = left.split(/\s*\+\s*/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const m = s.match(/^(.+?)[（(](.+)[）)]$/);
    return m ? {t:m[1].trim(), g:m[2].trim()} : {t:s, g:''};
  });
  return {structured: parts.length>=2 && parts.every(p=>LATIN.test(p.t)), parts, story, left};
}
function sufInfo(p){
  const m = p.g.match(/(名詞|形容詞|動詞|副詞)(尾|語尾)/);
  if(m) return {pos:m[1], est:false};
  if(p.g && !/尾/.test(p.g)) return null;
  const k = p.t.replace(/^[-~]/,'').toLowerCase();
  return SUF_POS[k] ? {pos:SUF_POS[k], est:true} : null;
}
const INFO = WORDS.map(w=>parseEty(w[2]));
const BASE = new Array(N).fill(-1), BKIND = new Array(N).fill(null);
INFO.forEach((inf,i)=>{
  if(!inf.structured || inf.parts.length!==2) return;
  const j = IDX.get(inf.parts[0].t.toLowerCase());
  const s = sufInfo(inf.parts[1]);
  if(j!==undefined && j!==i && s){ BASE[i]=j; BKIND[i]=s; }
});
const KIDS = Array.from({length:N}, ()=>[]);
BASE.forEach((b,i)=>{ if(b>=0) KIDS[b].push(i); });
function topOf(i){ let k=i, n=0; while(BASE[k]>=0 && n<6){ k=BASE[k]; n++; } return k; }
function roles(i){
  const inf = INFO[i];
  if(!inf.structured) return null;
  const out = [];
  if(BASE[i] >= 0){
    const a = inf.parts[0], b = inf.parts[1], s = BKIND[i];
    out.push({role:'元の単語', t:a.t, g:a.g || WORDS[BASE[i]][1], link:BASE[i]});
    out.push({role:'接尾辞 (Suffix)', t:b.t, g:b.g, pos:s.pos, est:s.est});
    return out;
  }
  const core = [], sufs = [];
  inf.parts.forEach((p,k)=>{ const s = k>0 ? sufInfo(p) : null; if(s) sufs.push({p,s}); else core.push(p); });
  core.forEach((p,k)=> out.push({role: (core.length>=2 && k===0) ? '接頭辞 (Prefix)' : '語根 (Root)', t:p.t, g:p.g}));
  sufs.forEach(x=> out.push({role:'接尾辞 (Suffix)', t:x.p.t, g:x.p.g, pos:x.s.pos, est:x.s.est}));
  return out;
}
function rootKeys(i){
  const r = roles(topOf(i));
  if(!r) return [];
  return r.filter(x=>x.role.startsWith('語根')).map(x=>x.t.toLowerCase().replace(/[^\p{L}]/gu,'')).filter(k=>k.length>=3);
}
const RMAP = new Map();
for(let i=0;i<N;i++) rootKeys(i).forEach(k=>{ if(!RMAP.has(k)) RMAP.set(k,[]); RMAP.get(k).push(i); });
const hash = s => s.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0, 7);
function family(i){
  const seen = new Set([topOf(i)]), out = [], cand = [];
  rootKeys(i).forEach(k=>(RMAP.get(k)||[]).forEach(j=>cand.push(j)));
  cand.sort((a,b)=>WORDS[a][0].localeCompare(WORDS[b][0]));
  const start = cand.length ? hash(WORDS[i][0]) % cand.length : 0;
  for(let n=0; n<cand.length && out.length<3; n++){
    const j = cand[(start+n) % cand.length], tj = topOf(j);
    if(seen.has(tj)) continue;
    seen.add(tj); out.push(j);
  }
  return out;
}
function forms(i){
  const t = topOf(i), res = {'名詞':[], '動詞':[], '形容詞':[], '副詞':[]}, seen = new Set([t]);
  (function walk(k){ KIDS[k].forEach(c=>{ if(seen.has(c)) return; seen.add(c); const s = BKIND[c]; if(s) res[s.pos].push({i:c, est:s.est}); walk(c); }); })(t);
  return {top:t, res};
}

/* ---------- 手書き（問題への書き込み・計算用紙）と、ミスの分析 ---------- */
const PEN = {tool:'pen', color:'#1B1B1B', w:3.5};            // tool: pen | eraser | hand
const PAD_COLORS = [['#1B1B1B','黒'],['#D23C36','赤'],['#2A4AC7','青']];
const PAD_WIDTHS = [[2,'細'],[3.5,'中'],[6,'太']];
const PU = 10000;                                           // 座標の単位（キャンバスの幅＝10000）
let lastPenAt = 0;
const pads = {};
const padStrokeW = () => PEN.tool === 'eraser' ? Math.max(18, PEN.w * 5) : PEN.w;
function padStyle(ctx, s, W){
  ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
  ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = s.w * W / 400; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function padDrawStroke(ctx, s, W){
  const p = s.p, n = p.length / 2, k = W / PU;
  if(!n) return;
  ctx.save(); padStyle(ctx, s, W);
  if(n === 1){ ctx.beginPath(); ctx.arc(p[0]*k, p[1]*k, ctx.lineWidth/2, 0, Math.PI*2); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.moveTo(p[0]*k, p[1]*k);
    for(let i = 1; i < n - 1; i++){ const x = p[2*i]*k, y = p[2*i+1]*k; ctx.quadraticCurveTo(x, y, (x + p[2*i+2]*k)/2, (y + p[2*i+3]*k)/2); }
    ctx.lineTo(p[2*n-2]*k, p[2*n-1]*k); ctx.stroke();
  }
  ctx.restore();
}
function padRedraw(p){
  if(!p.W) return;
  p.ctx.clearRect(0, 0, p.W, p.H);
  p.data.strokes.forEach(s=>padDrawStroke(p.ctx, s, p.W));
}
function padLive(p){                                          // 描いている最中は、最新の部分だけを描き足す
  const s = p.cur, q = s.p, n = q.length / 2, k = p.W / PU, ctx = p.ctx;
  const X = i => q[2*i]*k, Y = i => q[2*i+1]*k;
  ctx.save(); padStyle(ctx, s, p.W);
  if(n === 1){ ctx.beginPath(); ctx.arc(X(0), Y(0), ctx.lineWidth/2, 0, Math.PI*2); ctx.fill(); }
  else {
    ctx.beginPath();
    if(n === 2){ ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); }
    else {
      if(n === 3){ ctx.moveTo(X(0), Y(0)); ctx.lineTo((X(0)+X(1))/2, (Y(0)+Y(1))/2); }
      ctx.moveTo((X(n-3)+X(n-2))/2, (Y(n-3)+Y(n-2))/2);
      ctx.quadraticCurveTo(X(n-2), Y(n-2), (X(n-2)+X(n-1))/2, (Y(n-2)+Y(n-1))/2);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function padTail(p, s){
  const q = s.p, n = q.length / 2;
  if(n < 2) return;
  const k = p.W / PU, ctx = p.ctx;
  ctx.save(); padStyle(ctx, s, p.W);
  ctx.beginPath(); ctx.moveTo((q[2*n-4]+q[2*n-2])/2*k, (q[2*n-3]+q[2*n-1])/2*k); ctx.lineTo(q[2*n-2]*k, q[2*n-1]*k); ctx.stroke();
  ctx.restore();
}
function padAdd(p, e){
  const r = p.cv.getBoundingClientRect();
  if(!r.width) return false;
  const x = Math.round((e.clientX - r.left) / r.width * PU), y = Math.round((e.clientY - r.top) / r.width * PU), q = p.cur.p, m = q.length;
  if(m >= 2){ const dx = (x - q[m-2]) * r.width / PU, dy = (y - q[m-1]) * r.width / PU; if(dx*dx + dy*dy < 1.2) return false; }
  q.push(x, y);
  return true;
}
function padFit(p, force){
  const r = p.cv.getBoundingClientRect(), W = Math.round(r.width), H = Math.round(r.height);
  if(!W || !H) return;
  const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
  const changed = W !== p.W || H !== p.H || dpr !== p.dpr;
  if(!changed && !force) return;
  p.W = W; p.H = H; p.dpr = dpr;
  if(changed){ p.cv.width = Math.round(W * dpr); p.cv.height = Math.round(H * dpr); p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  padRedraw(p);
}
function padBind(p){
  const cv = p.cv;
  cv.addEventListener('pointerdown', e=>{
    if(PEN.tool === 'hand') return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(e.pointerType === 'pen') lastPenAt = Date.now();
    else if(e.pointerType === 'touch' && Date.now() - lastPenAt < 3000){ e.preventDefault(); return; }   // ペン使用中は、手のひらの接触を無視
    if(p.cur) return;
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    p.pid = e.pointerId;
    p.cur = {e: PEN.tool === 'eraser' ? 1 : 0, c: PEN.color, w: padStrokeW(), p: []};
    padAdd(p, e); padLive(p);
  });
  cv.addEventListener('pointermove', e=>{
    if(!p.cur || e.pointerId !== p.pid) return;
    e.preventDefault();
    if(e.pointerType === 'pen') lastPenAt = Date.now();
    const list = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    let any = false;
    list.forEach(ev=>{ if(padAdd(p, ev)) any = true; });
    if(any) padLive(p);
  });
  const end = e=>{
    if(!p.cur || e.pointerId !== p.pid) return;
    const s = p.cur; p.cur = null; p.pid = null;
    padTail(p, s);
    p.data.strokes.push(s);
    if(p.onChange) p.onChange();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('contextmenu', e=>e.preventDefault());
}
function padAttach(id, data, onChange){
  const cv = document.getElementById(id);
  if(!cv || !cv.getContext) return null;
  let p = pads[id];
  if(p && p.cv === cv){ p.data = data; p.onChange = onChange; padFit(p, true); return p; }
  if(p && p.ro){ try{ p.ro.disconnect(); }catch(e){} }

function exApply(r, q, correct){
  const s = exv.ses;
  s.good = !!correct;
  if(correct) q.ok++; else q.ng++;
  if(s.mode === 'range'){
    q.done = true;
    if(!correct){ q.weak = true; q.m = false; q.streak = 0; s.msg = '苦手に登録しました'; }
    if(r.qs.length && r.qs.every(x=>x.done)){ r.status = 'done'; s.notice = '「' + r.title + '」の範囲を終了しました'; }
  } else if(correct){
    q.streak++;
    if(q.streak >= 2){ q.weak = false; q.m = true; s.msg = '克服しました（2回連続で正解）'; } else s.msg = '克服まであと1回連続で正解';
  } else { q.streak = 0; s.msg = 'もう一度練習しましょう'; }
  s.last = q.id; save();
}

const UW = () => { const e = EXS(); return e.uw || (e.uw = {}); };
function uwHtml(txt, set, qid){
  let out = '', last = 0;
  txt.replace(/[A-Za-z][A-Za-z'’-]*/g, (w, i)=>{
    const k = w.toLowerCase().replace(/[’]/g, "'").replace(/^[-']+|[-']+$/g, '');
    out += esc(txt.slice(last, i)) + `<span class="uw${set.has(k) ? ' x' : ''}" role="button" tabindex="0" data-w="${esc(k)}" data-q="${qid || ''}" onclick="uwToggle(this.dataset.w, this.dataset.q)">${esc(w)}</span>`;
    last = i + w.length; return w;
  });
  return out + esc(txt.slice(last));
}
function uwCtx(txt, w){
  const parts = String(txt).replace(/\s+/g, ' ').split(/(?<=[.!?])\s+/);
  const hit = parts.find(s=>new RegExp('(^|[^A-Za-z])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^A-Za-z])', 'i').test(s));
  return (hit || '').slice(0, 160);
}
function uwToggle(w, qid){
  const c = exCur(), r = c.r, q = qid ? (r.qs.find(x=>x.id === qid) || c.q) : c.q, u = UW(); q.unk = q.unk || [];
  const k = q.unk.indexOf(w);
  if(k >= 0){ q.unk.splice(k, 1); if(u[w]){ u[w].n--; if(u[w].n <= 0) delete u[w]; } }
  else { q.unk.push(w); const o = u[w] || (u[w] = {n:0, ctx:'', at:Date.now()}); o.n++; if(!o.ctx) o.ctx = uwCtx(q.q, w) || uwCtx(q.pas || '', w); o.at = Date.now(); }
  save(); renderKeep();
}
const uwList = () => Object.entries(UW()).map(([w, o])=>({w, ...o})).sort((a,b)=>b.n-a.n || b.at-a.at);
function uwDel(w){ delete UW()[w]; EXS().ranges.forEach(r=>r.qs.forEach(q=>{ if(q.unk) q.unk = q.unk.filter(x=>x!==w); })); save(); render(); }
function uwPrompt(){

  if(!API.key) throw new Error('APIキーが未設定です');

function vrApply(name, ids, reset){
  S.vr = ids ? {name, ids} : null;
  if(reset){ const set = ids ? new Set(ids) : null; S.seen = set ? S.seen.filter(i=>!set.has(i)) : []; S.weakRound = []; }
  if(S.ses && S.ses.mode === 'basic') S.ses = null;
  save();
}
function parseWordList(txt){
  const ids = [], miss = [], got = new Set();
  const clean = s => s.replace(/^\s*(?:\d+\s*[.)）、:：]\s*|[-*・•]\s+)/, '').replace(/^[\s"'“”‘’(（]+|[\s"'“”‘’)）.!?]+$/g, '').trim();
  const add = w => { const i = IDX.get(w.toLowerCase()); if(i === undefined) return false; if(!got.has(i)){ got.add(i); ids.push(i); } return true; };
  String(txt).split(/\r?\n/).forEach(line=>{
    line = line.trim();
    if(!line || line[0] === '#') return;
    let pieces;
    if(line.includes(' | ')) pieces = [line.split(' | ')[0]];
    else if(line.includes('\t')) pieces = [line.split('\t')[0]];
    else pieces = line.split(/[,，、;；]+/);
    pieces.forEach(p=>{
      const w = clean(p);
      if(!w) return;
      if(add(w)) return;
      if(/\s/.test(w)){ const parts = w.split(/\s+/); const okAll = parts.map(x=>add(clean(x))); parts.forEach((x,k)=>{ if(!okAll[k] && clean(x)) miss.push(clean(x)); }); }
      else miss.push(w);
    });
  });
  return {ids, miss};
}
let vrv = {text:'', name:'', a:'A', b:'Z', reset:true, msg:''};
function vrFinish(name, ids, miss){
  vrApply(name, ids, vrv.reset);
  homeMsg = '範囲を「' + name + '」（' + ids.length + '語）にしました' + (vrv.reset ? '。この範囲の既出はリセットしました' : '')
    + (miss && miss.length ? '。見つからなかった ' + miss.length + ' 語：' + miss.slice(0,15).join('、') + (miss.length > 15 ? ' ほか' : '') : '');
  view = 'home'; render();
}
function vrApplyLetters(){
  let a = vrv.a.toLowerCase(), b = vrv.b.toLowerCase();
  if(a > b){ const x = a; a = b; b = x; }
  const ids = ORDER.filter(i=>{ const c = WORDS[i][0][0].toLowerCase(); return c >= a && c <= b; });
  if(!ids.length){ vrv.msg = '該当する単語がありません'; render(); return; }
  vrFinish(a === b ? a.toUpperCase() + 'で始まる単語' : a.toUpperCase() + '〜' + b.toUpperCase() + 'で始まる単語', ids);
}
function vrApplyText(){
  const r = parseWordList(vrv.text);

  vrFinish(vrv.name.trim() || 'マイ範囲', r.ids, r.miss);
}

function vocabTrend(){
  const cnt = new Map();
  weakList().forEach(i=>{
    const r = roles(i);
    if(!r) return;
    r.forEach(x=>{
      if(!x.role.startsWith('接頭辞') && !x.role.startsWith('語根')) return;
      const k = x.t.replace(/[^\p{L}]/gu,'').toLowerCase();
      if(k.length < 2) return;
      const e = cnt.get(k) || {n:0, g:x.g, role:x.role.split(' ')[0]};
      e.n++; cnt.set(k, e);
    });
  });
  return [...cnt.entries()].filter(([k,e])=>e.n >= 2).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
}

      <div class="card">${wl.length ? wl.slice(0,60).map(i=>`<div class="li"><div class="h"><b><a href="#" onclick="openCard(${i});return false">${esc(WORDS[i][0])}</a></b><span><span class="badge cnt">誤答${S.stat[i].ng}</span></span></div><div>${esc(WORDS[i][1])}</div></div>`).join('') + (wl.length > 60 ? `<p class="note">ほか ${wl.length-60}語（苦手タブで全部見られます）</p>` : '') : '<div class="empty"><b>苦手な単語はありません</b><span class="sub">英単語のテストで間違えた単語がここに集まります。</span></div>'}</div>`;
  } else {
    const by = exWeakByTopic(), R = EXS().ranges.filter(r=>exCounts(r).weak);
    body = `<div class="card"><h2>共テ・その他の苦手</h2>
      <p class="mini">苦手 <b>${items.length}</b>問</p>
      ${by.length ? by.map(([k,n])=>`<div class="mini">${esc(k)} … ${n}問</div>`).join('') : '<p class="note">共テ演習で間違えた問題がここに集まります。</p>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" ${items.length?'':'disabled'} onclick="exStart('weak',null)">苦手テスト（${items.length}問）</button></div>
      <p class="note">二次試験は準備中です。</p></div>
      ${anaCard()}
      ${R.map(r=>`<div class="card"><h2>${esc(r.title)}</h2><div class="sub">${esc(r.subject)}　苦手${exCounts(r).weak}問</div>
        ${items.filter(x=>x.r.id===r.id).slice(0,20).map(({q})=>`<div class="li"><div class="h"><b style="font-size:15px">${esc(q.topic || '（単元なし）')}</b><span class="badge cnt">誤答${q.ng}</span></div><div class="sub">${esc(q.q.replace(/\s+/g,' ').slice(0,80))}</div></div>`).join('')}
        <div style="height:8px"></div><button class="btn block" onclick="exStart('weak','${r.id}')">この範囲の苦手テスト</button></div>`).join('')}`;
  }
  return `<div class="top"><div><h1>苦手克服</h1><div class="sub">学習状況から、苦手をまとめます</div></div><button class="btn" onclick="goHub()">ホームへ</button></div>
  ${m ? `<div class="card"><b>${esc(m)}</b></div>` : ''}
  <div class="card">
    <h2>苦手をAIでまとめる</h2>
    <div class="sub">英単語・共テの苦手を、すべて集めて分析します（英単語は別枠でまとめます）。</div>
    <div class="row" style="margin:10px 0"><button class="btn primary" ${dis} onclick="toughSummarize()">自動でまとめる（API）</button><button class="btn" ${dis} onclick="toughCopy()">依頼文をコピー</button></div>
    ${S.tough && S.tough.text ? `<p class="note">まとめた日時：${esc(new Date(S.tough.at).toLocaleString('ja-JP'))}</p><div class="aibox">${esc(S.tough.text)}</div>` : '<p class="note">まだまとめていません。</p>'}
  </div>
  ${tabs}${body}`;
}

/* ---------- 出題 ---------- */
function makeQ(i){
  const correct = WORDS[i][1];
  const opts = [i];
  let tries = 0;
  while(opts.length < 4 && tries < 800){
    tries++;
    const j = Math.floor(Math.random()*N);
    if(opts.includes(j)) continue;
    if(WORDS[j][1] === correct) continue;
    if(stem(WORDS[j][0]) === stem(WORDS[i][0])) continue;   // 派生語は選択肢に出さない
    if(opts.some(k => WORDS[k][1] === WORDS[j][1])) continue;
    opts.push(j);
  }
  return {i, opts:shuffle(opts), pick:null, msg:'', good:false};
}
function pickNext(mode){
  if(mode === 'basic'){
    const seen = new Set(S.seen);
    const pool = [];
    const ids = vrIds();
    if(ids){ for(const i of ids) if(!seen.has(i)) pool.push(i); } else { for(let i=0;i<N;i++) if(!seen.has(i)) pool.push(i); }
    return pool.length ? rnd(pool) : null;
  }
  const pool = weakList();
  if(!pool.length) return null;
  let avail = pool.filter(i => !S.weakRound.includes(i));
  if(!avail.length){ S.weakRound = []; avail = pool; }
  const last = S.ses ? S.ses.last : null;
  if(avail.length > 1 && last !== null) avail = avail.filter(i => i !== last);
  return rnd(avail);
}

/* ---------- 判定ルール ----------
   不正解: 苦手に登録（基本✓・苦手✓はリセット）
   正解  : 苦手単語は、全問テストで正解→基本✓ / 苦手テストで正解→苦手✓
   両方✓ : 克服 */
function applyAnswer(i, correct, mode){
  const s = S.stat[i] || (S.stat[i] = {weak:false, b:false, k:false, m:false, ng:0, ok:0});
  let msg = '', good = correct;
  if(correct){
    s.ok++;
    if(s.weak){
      if(mode === 'basic') s.b = true; else s.k = true;
      if(s.b && s.k){ s.weak = false; s.m = true; msg = '克服しました'; }
      else {
        const need = [];
        if(!s.b) need.push('全問テスト');
        if(!s.k) need.push('苦手克服テスト');
        msg = '克服まであと：' + need.join('と') + 'で正解';
      }
    }
  } else {
    s.ng++; s.weak = true; s.m = false; s.b = false; s.k = false;
    msg = '苦手単語に登録しました';
  }
  return {msg, good};
}

/* ---------- 操作 ---------- */
function start(mode){
  confirming = null;
  if(!(S.ses && S.ses.mode === mode && S.ses.cur)){
    S.ses = {mode, n:0, ok:0, dots:[], setWrong:[], cur:null, ph:'q', last:null};
    nextQ();
  }
  view = 'test'; save(); render();
}
function nextQ(){
  const i = pickNext(S.ses.mode);
  if(i === null){ S.ses.cur = null; S.ses.ph = 'end'; }
  else { S.ses.cur = makeQ(i); S.ses.ph = 'q'; }
  save();
}
function choose(k){
  const ses = S.ses;
  if(!ses || ses.ph !== 'q') return;
  const q = ses.cur;
  q.pick = k;
  const correct = (k === q.i);
  const r = applyAnswer(q.i, correct, ses.mode);
  q.msg = r.msg; q.good = r.good;
  ses.n++; S.tot.n++;
  if(correct){ ses.ok++; S.tot.ok++; }
  ses.dots.push(correct ? 1 : 0);
  if(!correct) ses.setWrong.push(q.i);
  if(ses.mode === 'basic'){ if(!S.seen.includes(q.i)) S.seen.push(q.i); }
  else if(!S.weakRound.includes(q.i)) S.weakRound.push(q.i);
  ses.last = q.i;
  ses.ph = 'fb';
  save(); render();
}
function next(){
  const ses = S.ses;
  if(!ses || ses.ph !== 'fb') return;
  if(ses.n % SET_SIZE === 0){ ses.ph = 'br'; save(); render(); return; }
  nextQ(); render();
}
function cont(){
  const ses = S.ses;
  ses.dots = []; ses.setWrong = [];
  nextQ(); render();
}
function goHome(){ view='home'; confirming=null; render(); }
function resetSeen(){            // 乱数で出る単語の「既出」だけリセット（苦手・克服・成績は残す）
  const set = vrSet(); S.seen = set ? S.seen.filter(i=>!set.has(i)) : []; S.weakRound = []; confirming = null;
  if(S.ses && S.ses.mode === 'basic'){ S.ses = null; }
  save(); render();
}
function switchSlot(i){ DB.cur=i; S=DB.slots[i]; view='hub'; weakTab='weak'; confirming=null; save(); render(); }
function newSlot(){
  if(DB.slots.length >= MAX_SLOTS) return;
  DB.slots.push(blank('データ'+(DB.slots.length+1)));
  DB.cur = DB.slots.length-1; S = DB.slots[DB.cur];
  view='hub'; weakTab='weak'; confirming=null; save(); render();
}
function ask(c){ confirming = c; render(); }
function copyWeak(){
  const text = weakList().sort((a,b)=>S.stat[b].ng-S.stat[a].ng).map(i => WORDS[i][0]+'\t'+WORDS[i][1]).join('\n');
  const done = ok => { copyMsg = ok ? 'コピーしました' : 'コピーできませんでした'; render(); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false)); return;
    }
  }catch(e){}
  try{
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); const ok = document.execCommand('copy'); document.body.removeChild(t); done(ok);
  }catch(e){ done(false); }
}

/* ---------- 画面 ---------- */
function nav(){
  return `<div class="nav" role="tablist">
    <button onclick="goHub()">ホーム</button>
    <button onclick="goHome()" ${view==='home'||view==='test'||view==='vr'?'aria-current="page"':''}>テスト</button>
    <button onclick="view='book';render()" ${view==='book'||view==='card'?'aria-current="page"':''}>単語帳</button>
    <button onclick="view='weak';render()" ${view==='weak'?'aria-current="page"':''}>苦手 ${weakList().length}</button>
  </div>`;
}
function homeView(){
  const hm = homeMsg; homeMsg = '';
  const rn = vrCount(), seenN = vrSeenCount(), remain = rn - seenN;
  const weakN = weakList().length, doneN = doneList().length;
  const acc = S.tot.n ? Math.round(S.tot.ok / S.tot.n * 100) + '%' : '–';
  const ses = S.ses;
  const resumeBasic = ses && ses.mode==='basic' && ses.cur;
  const resumeWeak  = ses && ses.mode==='weak'  && ses.cur;
  let reset = '';
  if(confirming === 'seen'){
    reset = `<p class="mini"><b>既出をリセットしますか？</b></p><p class="note">選択中のデータの、全問テストの出題済みだけを戻します（範囲を指定している場合は、その範囲だけ）。苦手単語・克服・成績は残ります。</p>
      <div class="row"><button class="btn primary" onclick="resetSeen()">リセットする</button><button class="btn" onclick="ask(null)">やめる</button></div>`;
  } else {
    reset = `<div class="row"><button class="btn" onclick="ask('seen')">既出をリセット</button></div>`;
  }
  return `
  <div class="top"><div><h1>英単語テスト</h1><div class="sub">${N}語・4択　使用中：${esc(S.name)}</div></div></div>
  ${nav()}
  ${hm ? `<div class="card"><b>${esc(hm)}</b></div>` : ''}
  <div class="stats">
    <div class="stat"><b>${remain}</b><span>未出題</span></div>
    <div class="stat"><b>${weakN}</b><span>苦手</span></div>
    <div class="stat"><b>${doneN}</b><span>克服</span></div>
    <div class="stat"><b>${acc}</b><span>正答率</span></div>
  </div>
  <div class="card">
    <h2>出題範囲</h2>
    <p class="mini"><b>${S.vr ? esc(S.vr.name) : '全単語'}</b>（${rn}語）</p>
    <div class="sub">ファイルや手書きで、テストする単語を指定できます。</div>
    <div style="height:10px"></div>
    <button class="btn block" onclick="view='vr';render()">範囲を指定する</button>
  </div>
  <div class="card">
    <h2>全問テスト</h2>
    <div class="sub">まだ出ていない単語を乱数で出題します。</div>
    <div class="bar"><i style="width:${seenN/rn*100}%"></i></div>
    <div class="note" style="margin-bottom:10px">出題済み ${seenN} / ${rn}</div>
    <button class="btn primary block" ${remain===0?'disabled':''} onclick="start('basic')">${resumeBasic?'続きから（'+ses.n+'問済み）':'全問テストを始める'}</button>
    ${remain===0?'<p class="note">この範囲の単語をすべて出題しました。下の「既出をリセット」でもう一周できます。</p>':''}
  </div>
  <div class="card">
    <h2>苦手克服テスト</h2>
    <div class="sub">間違えた単語だけを乱数で出題します。</div>
    <div style="height:10px"></div>
    <button class="btn primary block" ${weakN===0?'disabled':''} onclick="start('weak')">${resumeWeak?'続きから（'+ses.n+'問済み）':'苦手 '+weakN+'語を練習する'}</button>
    ${weakN===0?'<p class="note">全問テストで間違えた単語がここに集まります。</p>':''}
  </div>
  <div class="card">
    <h2>リセット</h2>
    ${reset}
  </div>
  <p class="note foot">${SET_SIZE}問ごとに休憩画面が出ます。状態は1問ごとに自動保存され、ブラウザを閉じても続きから再開できます。</p>`;
}
function dotsHtml(ses){
  let h = '';
  for(let k=0;k<SET_SIZE;k++){
    const c = k < ses.dots.length ? (ses.dots[k] ? 'ok' : 'ng') : (k === ses.dots.length && ses.ph === 'q' ? 'now' : '');
    h += `<span class="${c}"></span>`;
  }
  return `<div class="dots" aria-label="この${SET_SIZE}問の結果">${h}</div>`;
}
function testView(){
  const ses = S.ses;
  const label = ses.mode === 'basic' ? '全問テスト' : '苦手克服テスト';
  const head = `<div class="top"><div><h1>${label}</h1><div class="sub">${ses.n}問解答・正解 ${ses.ok}</div></div>
    <button class="btn" onclick="goHome()">戻る</button></div>`;

  if(ses.ph === 'end'){
    const isBasic = ses.mode === 'basic';
    return head + `<div class="card empty"><b>${isBasic?'この範囲の単語をすべて出題しました':'苦手単語がなくなりました'}</b>
      <p class="sub">${isBasic?'「既出をリセット」で、苦手単語を残したままもう一周できます。':'全問テストで新しく間違えた単語がここに追加されます。'}</p>
      <div class="row" style="justify-content:center">${isBasic?'<button class="btn primary" onclick="resetSeen();goHome()">既出をリセット</button>':''}<button class="btn" onclick="goHome()">ホームへ</button></div></div>`;
  }

  if(ses.ph === 'br'){
    const ok = ses.dots.reduce((a,b)=>a+b,0);
    const wrongs = ses.setWrong.map(i => `<div class="li"><div class="h"><b>${esc(WORDS[i][0])}</b></div><div class="sub">${esc(WORDS[i][1])}</div></div>`).join('');
    return head + `<div class="card">
      <h2>休憩 — ${SET_SIZE}問終了</h2>
      ${dotsHtml(ses)}
      <p class="mini">この${SET_SIZE}問：<b>${ok}/${SET_SIZE}</b>正解</p>
      <p class="mini">苦手 <b>${weakList().length}</b>語 ／ 克服 <b>${doneList().length}</b>語</p>
      <p class="note">ここまでの状態を保存しました。</p>
      ${wrongs ? `<h2 style="margin-top:14px">間違えた単語</h2>${wrongs}` : '<p class="mini" style="margin-top:10px">全問正解です。</p>'}
      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="cont()">続ける</button><button class="btn" onclick="goHome()">ホームへ</button></div>
    </div>`;
  }

  const q = ses.cur, w = WORDS[q.i];
  const answered = ses.ph === 'fb';
  const opts = q.opts.map((j, idx) => {
    let c = 'opt';
    if(answered){
      if(j === q.i) c += ' right';
      else if(j === q.pick) c += ' wrong';
      else c += ' dim';
    }
    const sub = answered && j !== q.i ? `<span class="w">${esc(WORDS[j][0])}</span>` : '';
    return `<button class="${c}" ${answered?'disabled':''} onclick="choose(${j})"><span class="k">${idx+1}</span><span class="t">${esc(WORDS[j][1])}${sub}</span></button>`;
  }).join('');

  let fb = '';
  if(answered){
    fb = `<div class="fb ${q.good?'ok':'ng'}">
      <strong>${q.good?'正解':'不正解'}</strong>
      <p><b>${esc(w[0])}</b>：${esc(w[1])}</p>
      <p>語源：${esc(w[2])}</p>
      ${q.msg?`<p><b>${esc(q.msg)}</b></p>`:''}
    </div>
    <button class="btn block" style="margin-bottom:8px" onclick="openCard(${q.i})">単語帳でくわしく見る</button>
    <button class="btn primary block" onclick="next()">次の問題へ</button>`;
  }
  return head + dotsHtml(ses) + `<div class="card">
    <div class="word">${esc(w[0])}</div>
    <span class="tag">意味を選んでください（キー 1〜4）</span>
    <div class="opts">${opts}</div>
    ${fb}
  </div>`;
}
function weakView(){
  const list = weakTab === 'weak'
    ? weakList().sort((a,b)=>S.stat[b].ng-S.stat[a].ng)
    : doneList().sort((a,b)=>WORDS[a][0].localeCompare(WORDS[b][0]));
  const items = list.map(i => {
    const s = S.stat[i], w = WORDS[i];
    const badges = weakTab === 'weak'
      ? `<span class="badge cnt">誤答${s.ng}</span><span class="badge ${s.b?'on':''}">全問${s.b?'✓':''}</span><span class="badge ${s.k?'on':''}">苦手${s.k?'✓':''}</span>`
      : `<span class="badge on">克服</span>`;
    return `<div class="li"><div class="h"><b><a href="#" onclick="openCard(${i});return false">${esc(w[0])}</a></b><span>${badges}</span></div>
      <div>${esc(w[1])}</div><div class="note">${esc(w[2])}</div></div>`;
  }).join('');
  const empty = weakTab === 'weak'
    ? `<div class="empty"><b>苦手単語はありません</b><span class="sub">テストで間違えた単語がここに集まります。</span></div>`
    : `<div class="empty"><b>克服した単語はまだありません</b><span class="sub">全問テストと苦手克服テストの両方で正解すると克服になります。</span></div>`;
  return `<div class="top"><div><h1>苦手単語</h1><div class="sub">誤答の多い順</div></div></div>
  ${nav()}
  <div class="tabs">
    <button aria-pressed="${weakTab==='weak'}" onclick="weakTab='weak';copyMsg='';render()">苦手 ${weakList().length}</button>
    <button aria-pressed="${weakTab==='done'}" onclick="weakTab='done';copyMsg='';render()">克服済み ${doneList().length}</button>
  </div>
  ${weakTab==='weak' && list.length ? `<div class="row" style="margin-bottom:8px;align-items:center"><button class="btn" onclick="copyWeak()">一覧をコピー</button><span class="note">${copyMsg}</span></div>` : ''}
  <div class="card">${list.length ? items : empty}</div>
  ${weakTab==='weak' && list.length ? `<p class="note">克服＝全問テストと苦手克服テストの両方で正解。全問テストで再び出すには、ホームで既出をリセットします。</p>` : ''}`;
}
function render(){
  const app = document.getElementById('app');
  if(view === 'hub') app.innerHTML = hubView();
  else if(view === 'vr') app.innerHTML = vrView();
  else if(view === 'tough') app.innerHTML = toughView();
  else if(view === 'ni') app.innerHTML = niView();
  else if(view === 'test' && S.ses) app.innerHTML = testView();
  else if(view === 'weak') app.innerHTML = weakView();
  else if(view === 'book'){ app.innerHTML = bookView(); renderBookList(); }
  else if(view === 'card') app.innerHTML = cardView();
  else if(view === 'ex') app.innerHTML = exHomeView();
  else if(view === 'exr' && exv.rid && exRange(exv.rid)) app.innerHTML = exRangeView(exRange(exv.rid));
  else if(view === 'exq' && exv.ses) app.innerHTML = exQuestionView();
  else { view = 'home'; app.innerHTML = homeView(); }
  window.scrollTo(0, 0);
  afterRender();
}
document.addEventListener('keydown', e => {
  if(view !== 'test' || !S.ses) return;
  const ses = S.ses;
  if(ses.ph === 'q' && ['1','2','3','4'].includes(e.key)){ choose(ses.cur.opts[Number(e.key)-1]); }
  else if((e.key === 'Enter' || e.key === ' ') && ses.ph === 'fb'){ e.preventDefault(); next(); }
  else if(e.key === 'Enter' && ses.ph === 'br'){ cont(); }
});
applyBg();
try{ document.body.insertAdjacentHTML('beforeend', scrHtml()); }catch(e){ console.error(e); }
render();
</script>
